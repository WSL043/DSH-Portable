[package]
name = "deepseek-herness-linux"
version = "0.4.5"
description = "Native Linux shell for DSH-Portable"
authors = ["DSH-Portable contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }
semver = "=1.0.28"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tauri = { version = "=2.11.5", features = ["image-png", "tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
