<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>DeepSeek-Herness</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #171717; background: #f5f5f3; }
      @media (prefers-color-scheme: dark) { :root { color: #f2f2f0; background: #151515; } }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(420px, calc(100vw - 48px)); display: grid; gap: 18px; }
      header { display: flex; align-items: center; gap: 14px; }
      svg { width: 42px; height: 42px; flex: none; fill: currentColor; }
      h1 { margin: 0; font-size: 20px; font-weight: 650; }
      p { margin: 4px 0 0; color: #6c6c67; font-size: 14px; }
      .bar { height: 3px; overflow: hidden; border-radius: 999px; background: color-mix(in srgb, currentColor 14%, transparent); }
      .bar::after { content: ""; display: block; width: 36%; height: 100%; border-radius: inherit; background: #171717; animation: move 1.1s ease-in-out infinite alternate; }
      @media (prefers-color-scheme: dark) { .bar::after { background: #f2f2f0; } }
      @media (prefers-reduced-motion: reduce) { .bar::after { width: 60%; animation: none; } }
      @keyframes move { from { transform: translateX(0); } to { transform: translateX(178%); } }
      #error { display: none; white-space: pre-wrap; color: #b42318; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M56 15c-5 1-8 4-10 8-5-7-13-11-23-10C10 14 3 23 5 35c2 12 13 19 26 17 10-2 17-8 20-18 5-1 9-5 9-10 0-4-1-7-4-9ZM23 36a3 3 0 1 1 0-6 3 3 0 0 1 0 6Zm19-7c-2 9-8 14-17 15-7 1-13-2-15-8 8-2 15 0 21 5-1-3-3-6-5-8 6 0 11-1 16-4Z"/></svg>
        <div><h1>DeepSeek-Herness</h1><p id="status" data-zh="正在启动 DeepSeek Harness…" data-en="Starting DeepSeek Harness…">Starting DeepSeek Harness…</p></div>
      </header>
      <div class="bar" aria-hidden="true"></div>
      <p id="error" role="alert"></p>
    </main>
    <script>
      const chinese = navigator.language.toLowerCase().startsWith('zh')
      document.documentElement.lang = chinese ? 'zh-CN' : 'en'
      const status = document.getElementById('status')
      status.textContent = chinese ? status.dataset.zh : status.dataset.en
    </script>
  </body>
</html>
