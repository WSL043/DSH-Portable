<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>DeepSeek-Herness</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #0f1115; background: #fff; }
      @media (prefers-color-scheme: dark) { :root { color: #f9fafb; background: #151517; } }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      .wordmark { font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: .08em; }
      .spinner { box-sizing: border-box; width: 20px; height: 20px; border: 2px solid rgb(0 0 0 / 10%); border-top-color: currentColor; border-radius: 50%; animation: spin .8s linear infinite; }
      #status { margin: 0; color: #81858c; font-size: 12px; line-height: 18px; }
      @media (prefers-color-scheme: dark) { .spinner { border-color: rgb(255 255 255 / 12%); border-top-color: currentColor; } #status { color: #adb2b8; } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.6s; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      #error { display: none; white-space: pre-wrap; color: #b42318; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <div class="wordmark">HARNESS</div>
      <div class="spinner" role="progressbar" aria-label="Loading"></div>
      <p id="status" data-zh="正在启动 DeepSeek Harness…" data-en="Starting DeepSeek Harness…">Starting DeepSeek Harness…</p>
      <p id="error" role="alert"></p>
    </main>
    <script>
      const chinese = navigator.language.toLowerCase().startsWith('zh')
      document.documentElement.lang = chinese ? 'zh-CN' : 'en'
      const status = document.getElementById('status')
      status.textContent = chinese ? status.dataset.zh : status.dataset.en
    </script>
  </body>
</html>
