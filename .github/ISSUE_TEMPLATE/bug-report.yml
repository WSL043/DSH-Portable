name: Bug 报告 / Bug report
description: 报告可以稳定复现的问题 / Report a reproducible problem
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: 使用方式 / Package
      options:
        - Windows 便携版 / Windows portable
        - macOS 便携 ZIP / macOS portable ZIP
        - Linux AppImage
        - Linux 完整便携目录 / Linux portable folder
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DSH-Portable 产品版本 / Product version
      description: 在 设置 → 更新 页面查看；请勿填写 DSH 内核版本。 / Find it in Settings → Update; do not enter the DSH core version here.
      placeholder: 例如 / e.g. 0.8.12
    validations:
      required: true
  - type: input
    id: core-version
    attributes:
      label: DSH 内核版本 / Core version
      description: 在同一更新页的 DeepSeek Harness 区域查看。 / Find it under DeepSeek Harness on the same Updates page.
      placeholder: 例如 / e.g. 0.1.7-alpha.1
  - type: input
    id: upgraded-from
    attributes:
      label: 刚升级过吗？从哪个版本升级 / Upgraded from which version
      description: 没升级过可留空。升级后才出现的问题，请同时写下升级前选用的内核版本。 / Leave empty if you did not just upgrade. For problems that began after an upgrade, also say which core version you were using before.
      placeholder: 例如 / e.g. 0.8.10，内核 0.2.1-alpha.2 / e.g. 0.8.10 with core 0.2.1-alpha.2
  - type: textarea
    id: problem
    attributes:
      label: 发生了什么 / What happened
      description: 请写实际结果和预期结果。 / Describe the actual and expected result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 请说明问题发生在启动时还是执行任务时，以及出现前刚安装、更新或启停了哪些插件。 / State whether this happens at startup or during a task, and which plugins were just installed, updated, enabled, or disabled.
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 日志或截图 / Logs or screenshots
      description: 可选。主界面打不开时，完全退出后运行根目录 DSH-Recovery.exe，选 4 导出支持报告。上传前检查并删除私人信息；不要上传原始会话或凭据。 / Optional. If the workspace will not open, quit fully and use option 4 in DSH-Recovery.exe at the package root. Review and remove private information before attaching the support report; do not upload raw sessions or credentials.
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认 / Privacy check
      options:
        - label: 我没有粘贴 API Key、登录凭据或私人会话。 / I did not paste API keys, login credentials, or private conversations.
          required: true
