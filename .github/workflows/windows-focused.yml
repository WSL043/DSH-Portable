name: Focused Windows artifact verification

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing CI run containing windows-x64-build (diagnostic reuse only)
        required: true
        type: string

      scope:
        description: Isolated tray bridge or the original native check sequence
        type: choice
        options: [tray, native, migration]
        default: tray
      node_version:
        description: Harness Node version for controlled environment comparison
        type: choice
        options: [24.19.0, 22.23.2]
        default: 24.19.0

permissions:
  contents: read
  actions: read

jobs:
  tray-bridge:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
      - name: Record artifact and harness provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: |
          New-Item -ItemType Directory evidence | Out-Null
          gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" --jq '{id,head_sha,path,conclusion,head_branch}' | Out-File evidence/source-run.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve source run' }
          git rev-parse HEAD | Out-File evidence/harness-commit.txt
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          path: artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify tray bridge using existing product
        if: inputs.scope == 'tray'
        shell: pwsh
        run: |
          $Root = Join-Path $env:RUNNER_TEMP 'dsh-focused'
          New-Item -ItemType Directory -Force $Root | Out-Null
          Get-FileHash artifacts/DSH-Portable-windows-x64-offline.zip | Format-List | Out-File evidence/artifact-sha256.txt
          tar.exe -xf artifacts/DSH-Portable-windows-x64-offline.zip -C $Root
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          node scripts/smoke-windows-tray-bridge.mjs (Join-Path $Root 'DSH-Portable') 2>&1 | Tee-Object evidence/tray-bridge.log
          if ($LASTEXITCODE -ne 0) { throw 'Tray bridge check failed; see retained evidence' }
      - name: Verify original native check sequence
        if: inputs.scope == 'native'
        shell: powershell
        run: |
          Get-FileHash artifacts/DSH-Portable-windows-x64-offline.zip | Format-List | Out-File evidence/artifact-sha256.txt
          Start-Transcript -Path evidence/native-sequence.log
          try { ./scripts/verify-windows-native-artifact.ps1 -RunnerLabel focused } finally { Stop-Transcript }
      - name: Verify migration independently
        if: inputs.scope == 'migration'
        shell: pwsh
        run: |
          $Root = Join-Path $env:RUNNER_TEMP 'dsh-native-migration-host'
          New-Item -ItemType Directory -Force $Root | Out-Null
          tar.exe -xf artifacts/DSH-Portable-windows-x64-offline.zip -C $Root
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          node scripts/smoke-windows-data-export.mjs (Join-Path $Root 'DSH-Portable') (Join-Path $env:RUNNER_TEMP 'dsh-native-migration-evidence-focused') 2>&1 | Tee-Object evidence/migration.log
          if ($LASTEXITCODE -ne 0) { throw 'Migration check failed' }
      - name: Retain native structured failure evidence
        if: always() && inputs.scope != 'tray'
        uses: actions/upload-artifact@v7
        with:
          name: focused-native-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/dsh-startup-transition-focused/
            ${{ runner.temp }}/dsh-native-migration-evidence-focused/
            ${{ runner.temp }}/dsh-desktop-host/DSH-Portable/data/logs/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: focused-windows-${{ matrix.runner }}
          path: evidence/
          retention-days: 14
