name: Official desktop update contract probe
on:
  workflow_dispatch:
  schedule:
    - cron: '29 * * * *'
permissions:
  contents: read
concurrency:
  group: official-contract-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.identity.outputs.cache_key }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Resolve the latest official desktop feed
        run: node experiments/official-payload/resolve-candidate.mjs
      - id: identity
        name: Build the successful-probe identity key
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const candidate = JSON.parse(readFileSync('experiments/official-payload/candidate.json', 'utf8'));
          const digest = Buffer.from(candidate.sha512, 'base64').toString('hex');
          console.log(`cache_key=official-contract-${candidate.version}-${digest}`);
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: official-contract-candidate
          path: experiments/official-payload/candidate.json
          retention-days: 7

  probe:
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: official-contract-candidate
          path: experiments/official-payload
      - id: success-cache
        uses: actions/cache/restore@v4
        with:
          path: build/official-contract-success
          key: ${{ needs.candidate.outputs.cache_key }}
      - name: Skip an already successful version and digest
        if: steps.success-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          Write-Output 'The exact official version and SHA-512 already passed: ${{ needs.candidate.outputs.cache_key }}'
      - id: official-payload
        name: Download, validate, and unpack the official installer
        if: steps.success-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/official-payload-stage
        with:
          candidate: experiments/official-payload/candidate.json
          installer: ${{ runner.temp }}\official-desktop-installer.exe
          expanded: build/official-contract-probe/official-payload
      - name: Run update contract probe
        if: steps.success-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          EXPANDED_PAYLOAD: build/official-contract-probe/official-payload
        run: |
          ./experiments/official-payload/contract/run-contract-probe.ps1 -AppDir $env:EXPANDED_PAYLOAD -WorkRoot 'build/official-contract-probe/work' -Locale en
          if ($LASTEXITCODE -ne 0) { throw 'Official update contract probe failed' }
      - name: Save exact successful probe identity
        if: success() && steps.success-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $null = New-Item -ItemType Directory -Force -Path 'build/official-contract-success'
          $candidate = Get-Content ./experiments/official-payload/candidate.json -Raw | ConvertFrom-Json
          @{ version = $candidate.version; sha512 = $candidate.sha512 } | ConvertTo-Json | Set-Content 'build/official-contract-success/identity.json' -Encoding utf8
      - uses: actions/cache/save@v4
        if: success() && steps.success-cache.outputs.cache-hit != 'true'
        with:
          path: build/official-contract-success
          key: ${{ needs.candidate.outputs.cache_key }}
      - uses: actions/upload-artifact@v7
        if: always() && steps.success-cache.outputs.cache-hit != 'true'
        with:
          name: official-contract-probe-evidence
          path: |
            build/official-contract-probe/contract-report.json
            build/official-contract-probe/request-log.jsonl
            build/official-contract-probe/stub-calls.jsonl
            build/official-contract-probe/ui-probe-output.log
            build/official-contract-probe/ui-probe-stderr.log
            build/official-contract-probe/feed-stderr.log
            build/official-contract-probe/feed-start.jsonl
            build/official-contract-probe/ui-result.json
          if-no-files-found: warn
          retention-days: 14
