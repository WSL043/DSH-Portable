name: Apply reviewed security dispositions

on:
  pull_request:
    paths:
      - '.github/security-review/review-manifest.json'
      - '.github/security-review/reconcile-reviewed-alerts.mjs'
      - '.github/security-review/api-errors.mjs'
      - '.github/workflows/reviewed-alert-dispositions.yml'

permissions:
  contents: read

concurrency:
  group: reviewed-security-dispositions
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'WSL043/DSH-Portable' && github.event.pull_request.number == 139 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/data-transfer-safety-20260919'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Apply only the explicit reviewed IDs after immutable evidence checks
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_OUTPUT_DIR: ${{ runner.temp }}/reviewed-alert-dispositions
        run: node --import ./.github/security-review/api-errors.mjs .github/security-review/reconcile-reviewed-alerts.mjs .github/security-review/review-manifest.json --apply
      - name: Preserve actual API receipts including partial failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reviewed-alert-dispositions
          path: ${{ runner.temp }}/reviewed-alert-dispositions/
          if-no-files-found: error
          retention-days: 30
