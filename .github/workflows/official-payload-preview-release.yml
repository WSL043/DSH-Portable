name: Probe bundled dependency source build
on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Unused compatibility input; this branch only probes dependencies
        required: true
        default: "0"
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: dependency-source-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - uses: actions/checkout@v7
        with:
          repository: pnpm/pnpm
          ref: 8e1e4c0aaece387dfda16377b2ba31f7a1a2602c
          path: pnpm-source
          persist-credentials: false
      - name: Bootstrap original pinned package manager without install scripts
        run: npm install --prefix "$RUNNER_TEMP/bootstrap" --ignore-scripts --no-audit --no-fund pnpm@11.11.0
      - name: Rebuild and exercise actual bundled network consumer
        run: node scripts/probe-bundled-dependency-source.mjs --source pnpm-source --pnpm "$RUNNER_TEMP/bootstrap/node_modules/pnpm/bin/pnpm.cjs" --output "$RUNNER_TEMP/dependency-source-probe"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-source-probe
          path: ${{ runner.temp }}/dependency-source-probe
          if-no-files-found: error
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 1f81c047fc48fa190a683e469daa699857e9afe8
          path: upstream
          persist-credentials: false
      - name: Pin only the reviewed Zod dependency in the original source lock
        run: node scripts/prepare-reviewed-source-dependencies.mjs --source upstream --lock upstream.lock.json --output "$RUNNER_TEMP/frontend-probe/source-receipt.json"
      - name: Install the original selected upstream build tool
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.5
      - name: Frozen source build
        run: |
          pnpm --dir upstream install --frozen-lockfile
          pnpm --dir upstream run build:official
          pnpm --dir upstream run release:pack --family dsh --out dist/npm --concurrency 8
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-source-probe
          path: |
            ${{ runner.temp }}/frontend-probe
            upstream/dist/npm
          if-no-files-found: error
          retention-days: 7
