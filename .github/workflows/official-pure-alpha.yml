name: Package pure portable alpha.4 as a draft
on:
  workflow_dispatch:
    inputs:
      version:
        description: Accepted official desktop version (blank selects the newest channel version)
        required: false
        default: ''
        type: string
      smoke:
        description: Which package smokes to run; a draft release is only created after both ran (all)
        required: false
        default: all
        type: choice
        options: [all, full, lite, none]
permissions:
  contents: read
# Update each commit and version together when upgrading a bundled default plugin.
env:
  IMAGE_VIEWER_REPOSITORY: WSL043/dsh-image-viewer
  IMAGE_VIEWER_COMMIT: 88e517e656d2e31159492eb6d7c98f5c37484766
  IMAGE_VIEWER_VERSION: 0.1.5
  CHAT_MANAGER_REPOSITORY: WSL043/dsh-chat-manager
  CHAT_MANAGER_COMMIT: c7e9f5d82f58f311b1dbbd93c220d3a4e4b2fe06
  CHAT_MANAGER_VERSION: 1.5.4
concurrency:
  group: official-pure-alpha-draft
  cancel-in-progress: false
jobs:
  # A few minutes of static checks that stop the mistakes a 25-minute real run would otherwise find one at a time
  # (a missing checkout, a step output without an id, a repeated PowerShell parameter, a script Windows PowerShell 5.1 cannot parse).
  preflight:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Parse every packaged PowerShell source with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          foreach ($file in Get-ChildItem -Path 'experiments/official-payload', 'launcher' -Recurse -File -Include *.ps1, *.psm1) {
            $errors = $null; $tokens = $null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $bad += ($file.FullName + ': ' + $errors[0].Message) }
          }
          if ($bad.Count -gt 0) { throw ($bad -join [Environment]::NewLine) }
      - name: Provide js-yaml for the static workflow tests
        shell: pwsh
        run: |
          npm pack js-yaml@4.1.0 --silent --pack-destination $env:RUNNER_TEMP
          New-Item -ItemType Directory -Force app/node_modules | Out-Null
          tar -xzf (Join-Path $env:RUNNER_TEMP 'js-yaml-4.1.0.tgz') -C $env:RUNNER_TEMP
          Move-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'package') -Destination app/node_modules/js-yaml
      - name: Run the official payload static and contract tests
        shell: pwsh
        run: node --test tests/official-pure-portable.test.mjs tests/official-pure-alpha-workflow.test.mjs tests/official-pure-alpha-seed-smoke.test.mjs tests/official-desktop-channel.test.mjs tests/official-seed-plugins.test.mjs tests/official-seed-launcher.test.mjs
  package:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.select.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.IMAGE_VIEWER_REPOSITORY }}
          ref: ${{ env.IMAGE_VIEWER_COMMIT }}
          path: build/orch-080/T32/plugins/dsh-image-viewer
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CHAT_MANAGER_REPOSITORY }}
          ref: ${{ env.CHAT_MANAGER_COMMIT }}
          path: build/orch-080/T32/plugins/dsh-chat-manager
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - id: select
        name: Read the production channel and select an accepted official version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REQUESTED_VERSION) {
            $selection = node experiments/official-payload/channel/select-candidate.mjs $env:REQUESTED_VERSION 'build/orch-080/T32'
          } else {
            $selection = node experiments/official-payload/channel/select-candidate.mjs 'build/orch-080/T32'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the production qualified channel index' }
          $candidate = Get-Content -LiteralPath 'build/orch-080/T32/candidate.json' -Raw | ConvertFrom-Json
          "version=$($candidate.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - id: installer
        name: Download and validate the selected official installer
        uses: ./.github/actions/official-payload-stage
        with:
          candidate: build/orch-080/T32/candidate.json
          installer: ${{ runner.temp }}/official-alpha-installer.exe
      - name: Checkout and pack the pinned default plugins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            [pscustomobject]@{
              directory = 'build/orch-080/T32/plugins/dsh-image-viewer'
              name = 'dsh-image-viewer'
              version = $env:IMAGE_VIEWER_VERSION
              ignoreInstallScripts = $true
            },
            [pscustomobject]@{
              directory = 'build/orch-080/T32/plugins/dsh-chat-manager'
              name = 'dsh-chat-manager'
              version = $env:CHAT_MANAGER_VERSION
              ignoreInstallScripts = $false
            }
          )
          foreach ($target in $targets) {
            $manifestPath = Join-Path $target.directory 'package.json'
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if ($manifest.name -cne $target.name) { throw "Unexpected plugin package name at $manifestPath" }
            if ([string]$manifest.version -cne [string]$target.version) { throw "Plugin $($target.name) package.json version $($manifest.version) does not match pinned version $($target.version)" }
            Push-Location $target.directory
            try {
              $installArgs = @('install', '--frozen-lockfile')
              if ($target.ignoreInstallScripts) { $installArgs += '--ignore-scripts' }
              & pnpm @installArgs
              if ($LASTEXITCODE -ne 0) { throw "pnpm install failed for $($target.name) with exit code $LASTEXITCODE" }
              & pnpm run test:behavior
              if ($LASTEXITCODE -ne 0) { throw "Behavior tests failed for $($target.name) with exit code $LASTEXITCODE" }
              & pnpm run build
              if ($LASTEXITCODE -ne 0) { throw "Build failed for $($target.name) with exit code $LASTEXITCODE" }
              & git diff --exit-code -- lib
              if ($LASTEXITCODE -ne 0) { throw "Generated lib output differs from the pinned CI source for $($target.name)" }
              $packDirectory = Join-Path $env:GITHUB_WORKSPACE ('build/orch-080/T32/packages/' + $target.name)
              New-Item -ItemType Directory -Path $packDirectory -Force | Out-Null
              & pnpm pack --pack-destination $packDirectory
              if ($LASTEXITCODE -ne 0) { throw "pnpm pack failed for $($target.name) with exit code $LASTEXITCODE" }
              $archive = Join-Path $packDirectory ($target.name + '-' + $target.version + '.tgz')
              if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "Expected packed plugin archive is missing: $archive" }
              if (@(Get-ChildItem -LiteralPath $packDirectory -Filter '*.tgz' -File).Count -ne 1) { throw "Expected exactly one packed archive for $($target.name)" }
            } finally {
              Pop-Location
            }
          }
      - name: Package the pure portable layout against the production channel
        shell: pwsh
        env:
          INSTALLER: ${{ steps.installer.outputs.installer }}
        run: |
          $ErrorActionPreference = 'Stop'
          $urls = node experiments/official-payload/channel/constants.mjs | ConvertFrom-Json
          if (-not $urls.channelBaseUrl -or -not $urls.indexUrl) { throw 'Production channel constants are unavailable' }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw 'GitHub Windows runner 7-Zip is required' }
          $imageViewer = Join-Path $env:GITHUB_WORKSPACE ('build/orch-080/T32/packages/dsh-image-viewer/dsh-image-viewer-' + $env:IMAGE_VIEWER_VERSION + '.tgz')
          $chatManager = Join-Path $env:GITHUB_WORKSPACE ('build/orch-080/T32/packages/dsh-chat-manager/dsh-chat-manager-' + $env:CHAT_MANAGER_VERSION + '.tgz')
          ./experiments/official-payload/package-pure.ps1 `
            -Installer $env:INSTALLER `
            -Output 'build/orch-080/T32/package' `
            -SevenZip $sevenZip `
            -FeedUrl $urls.channelBaseUrl `
            -IndexUrl $urls.indexUrl `
            -SeedPlugin @($imageViewer, $chatManager)
          if ($LASTEXITCODE -ne 0) { throw 'Pure portable packaging failed' }
          $archive = 'build/orch-080/T32/DSH-Portable-1.0.0-alpha.4-windows-x64.zip'
          Compress-Archive -Path 'build/orch-080/T32/package/*' -DestinationPath $archive -CompressionLevel Optimal
          ./experiments/official-payload/package-pure.ps1 `
            -Bootstrap `
            -Output 'build/orch-080/T32/package-lite' `
            -SevenZip $sevenZip `
            -FeedUrl $urls.channelBaseUrl `
            -IndexUrl $urls.indexUrl `
            -SeedPlugin @($imageViewer, $chatManager)
          if ($LASTEXITCODE -ne 0) { throw 'Lite portable packaging failed' }
          $liteRoot = 'build/orch-080/T32/package-lite'
          $liteFiles = @(Get-ChildItem -LiteralPath $liteRoot -Recurse -File)
          $liteBytes = [long](($liteFiles | Measure-Object Length -Sum).Sum)
          if ($liteBytes -ge 40MB) { throw "Lite package exceeds the 40 MiB limit: $liteBytes bytes" }
          foreach ($required in @('DeepSeek Harness Portable.exe', 'launcher/apply-update.ps1', 'launcher/Payload.psm1', 'launcher/follow.json', 'launcher/bootstrap.json', 'launcher/7z.exe', 'launcher/seed/seed.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $liteRoot $required) -PathType Leaf)) { throw "Lite package is missing $required" }
          }
          if ((Test-Path -LiteralPath (Join-Path $liteRoot 'app/current.json')) -or @(Get-ChildItem -LiteralPath (Join-Path $liteRoot 'app') -Directory).Count -ne 0) { throw 'Lite package contains a preinstalled official app' }
          $liteArchive = 'build/orch-080/T32/DSH-Portable-1.0.0-alpha.4-windows-x64-lite.zip'
          Compress-Archive -Path 'build/orch-080/T32/package-lite/*' -DestinationPath $liteArchive -CompressionLevel Optimal
          [IO.File]::WriteAllText('build/orch-080/T32/lite-package-size.txt', ($liteBytes.ToString() + "`n"), [Text.Encoding]::ASCII)
      - name: Smoke first and second startup, seed state, disabled config, and moved root
        if: inputs.smoke == 'all' || inputs.smoke == 'full'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./experiments/official-payload/e2e/smoke-alpha-seeded.ps1 `
            -Archive 'build/orch-080/T32/DSH-Portable-1.0.0-alpha.4-windows-x64.zip' `
            -WorkRoot 'build/orch-080/T32/smoke-root' `
            -EvidenceRoot 'build/orch-080/T32/evidence'
      - name: Smoke lite bootstrap install from the accepted channel and official CDN
        if: inputs.smoke == 'all' || inputs.smoke == 'lite'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./experiments/official-payload/e2e/smoke-alpha-seeded.ps1 `
            -Archive 'build/orch-080/T32/DSH-Portable-1.0.0-alpha.4-windows-x64-lite.zip' `
            -WorkRoot 'build/orch-080/T32/smoke-lite-root' `
            -EvidenceRoot 'build/orch-080/T32/lite-evidence' `
            -Bootstrap
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: official-pure-alpha-4-lite-smoke-evidence
          path: build/orch-080/T32/lite-evidence/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: official-pure-alpha-4-seed-smoke-evidence
          path: build/orch-080/T32/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Create checksums and source provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Get-Content -LiteralPath 'build/orch-080/T32/candidate.json' -Raw | ConvertFrom-Json
          $archive = 'build/orch-080/T32/DSH-Portable-1.0.0-alpha.4-windows-x64.zip'
          $liteArchive = 'build/orch-080/T32/DSH-Portable-1.0.0-alpha.4-windows-x64-lite.zip'
          $launcher = 'build/orch-080/T32/package/DeepSeek Harness Portable.exe'
          $zipHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $liteZipHash = (Get-FileHash -LiteralPath $liteArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          $launcherHash = (Get-FileHash -LiteralPath $launcher -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$zipHash  DSH-Portable-1.0.0-alpha.4-windows-x64.zip", "$liteZipHash  DSH-Portable-1.0.0-alpha.4-windows-x64-lite.zip", "$launcherHash  DeepSeek Harness Portable.exe") | Set-Content -LiteralPath 'build/orch-080/T32/checksums.txt' -Encoding ascii
          $source = @("# DSH-Portable 1.0.0-alpha.4 source", '', "- Official desktop version: $($candidate.version)", "- Official installer URL: $($candidate.installerUrl)", "- Official installer SHA-512 (base64): $($candidate.sha512)", "- Full package SHA-256: $zipHash", "- Lite package SHA-256: $liteZipHash", "- Launcher SHA-256: $launcherHash", "- Source commit: $env:GITHUB_SHA", '', 'The lite package downloads the accepted official desktop from the official CDN on first launch. Both packages are draft assets and do not replace the stable Native line.')
          $source | Set-Content -LiteralPath 'build/orch-080/T32/SOURCE.md' -Encoding utf8
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: official-pure-alpha-4-draft-assets
          path: |
            build/orch-080/T32/DSH-Portable-1.0.0-alpha.4-windows-x64.zip
            build/orch-080/T32/DSH-Portable-1.0.0-alpha.4-windows-x64-lite.zip
            build/orch-080/T32/checksums.txt
            build/orch-080/T32/SOURCE.md
            build/orch-080/T32/lite-package-size.txt
            build/orch-080/T32/smoke-root-moved/smoke-report.json
            build/orch-080/T32/smoke-root-moved/smoke-page.json
          if-no-files-found: warn
          retention-days: 14

  draft-release:
    needs: package
    # Never publish a draft from a run that skipped a smoke.
    if: inputs.smoke == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: official-pure-alpha-4-draft-assets
          path: release-input
      - name: Create or update only the alpha.4 draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.0-alpha.4
          RELEASE_NAME: DSH-Portable 1.0.0-alpha.4 — Pure portable
        run: |
          set -euo pipefail
          # Draft releases have no tag yet, so the tags endpoint cannot see them: search the release list instead.
          # A draft whose tag does not exist yet is reported as "untagged-..."; match it by title too.
          EXISTING=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" or (.draft and .name == \"$RELEASE_NAME\")) | [.id, .draft] | join(\" \")" | head -n 1)
          if [ -z "$EXISTING" ]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title 'DSH-Portable 1.0.0-alpha.4 — Pure portable' --notes-file release-input/SOURCE.md
          else
            RELEASE_ID=${EXISTING%% *}
            DRAFT=${EXISTING##* }
            if [ "$DRAFT" != true ]; then echo 'Refusing to mutate an existing non-draft alpha.4 release' >&2; exit 1; fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" -f name="$RELEASE_NAME" -F body=@release-input/SOURCE.md -F draft=true -F prerelease=true > /dev/null
          fi
          node scripts/upload-release-assets.mjs "$RELEASE_TAG" release-input/DSH-Portable-1.0.0-alpha.4-windows-x64.zip release-input/DSH-Portable-1.0.0-alpha.4-windows-x64-lite.zip release-input/checksums.txt release-input/SOURCE.md --mutable
