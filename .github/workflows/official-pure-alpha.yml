name: Package pure portable
on:
  workflow_dispatch:
    inputs:
      version:
        description: Accepted official desktop version (blank selects the newest channel version)
        required: false
        default: ''
        type: string
      alpha:
        description: Alpha number of this draft (1.0.0-alpha.N); also the draft release it creates or updates
        required: false
        default: '5'
        type: string
      smoke:
        description: Which package smokes to run; a draft release is only created after both ran (all)
        required: false
        default: all
        type: choice
        options: [all, full, lite, none]
      publish_draft:
        description: Explicitly create or update a prerelease draft after both package smokes pass
        required: false
        default: false
        type: boolean
      stable_candidate:
        description: Build an internal Windows 1.0.0 candidate with all smokes and publication disabled
        required: false
        default: false
        type: boolean
      rc_candidate:
        description: Build Windows 1.0.0-rc.1 from an explicit accepted official version with all smokes
        required: false
        default: false
        type: boolean
permissions:
  contents: read
env:
  ALPHA: ${{ inputs.alpha || '5' }}
  PORTABLE_VERSION: ${{ inputs.stable_candidate && '1.0.0' || inputs.rc_candidate && '1.0.0-rc.1' || format('1.0.0-alpha.{0}', inputs.alpha || '5') }}
concurrency:
  group: official-pure-alpha-draft
  cancel-in-progress: false
jobs:
  # A few minutes of static checks that stop the mistakes a 25-minute real run would otherwise find one at a time
  # (a missing checkout, a step output without an id, a repeated PowerShell parameter, a script Windows PowerShell 5.1 cannot parse).
  preflight:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Validate package version and draft mode
        shell: bash
        env:
          RC_CANDIDATE: ${{ inputs.rc_candidate }}
          STABLE_CANDIDATE: ${{ inputs.stable_candidate }}
          PUBLISH_DRAFT: ${{ inputs.publish_draft }}
          SMOKE: ${{ inputs.smoke }}
          OFFICIAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$STABLE_CANDIDATE" == true && "$RC_CANDIDATE" == true ]]; then
            echo "Choose either a stable candidate or an RC" >&2; exit 1
          elif [[ "$STABLE_CANDIDATE" == true ]]; then
            [[ "$PUBLISH_DRAFT" != true && "$SMOKE" == all && -n "$OFFICIAL_VERSION" ]] || { echo "A stable candidate requires an explicit official version, all smokes, and publication disabled" >&2; exit 1; }
          elif [[ "$RC_CANDIDATE" == true ]]; then
            [[ "$SMOKE" == all && -n "$OFFICIAL_VERSION" ]] || { echo "An RC requires an explicit official version and all smokes" >&2; exit 1; }
          else
            [[ "$ALPHA" =~ ^(0|[1-9][0-9]{0,2})$ ]] || { echo "Invalid alpha number" >&2; exit 1; }
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - name: Parse every packaged PowerShell source with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          foreach ($file in Get-ChildItem -Path 'experiments/official-payload', 'launcher' -Recurse -File -Include *.ps1, *.psm1) {
            $errors = $null; $tokens = $null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $bad += ($file.FullName + ': ' + $errors[0].Message) }
          }
          if ($bad.Count -gt 0) { throw ($bad -join [Environment]::NewLine) }
      - name: Provide js-yaml for the static workflow tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dependency = (Get-Content -LiteralPath app/package-lock.json -Raw | ConvertFrom-Json -AsHashtable).packages.'node_modules/js-yaml'
          if ($dependency.version -isnot [string] -or $dependency.version -notmatch '^\d+\.\d+\.\d+$' -or $dependency.integrity -isnot [string] -or $dependency.integrity -notmatch '^sha512-[A-Za-z0-9+/]{86}==$') { throw 'Invalid locked js-yaml identity' }
          npm pack "js-yaml@$($dependency.version)" --registry https://registry.npmjs.org --ignore-scripts --silent --pack-destination $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the locked js-yaml test dependency' }
          $archive = Join-Path $env:RUNNER_TEMP "js-yaml-$($dependency.version).tgz"
          $expected = [BitConverter]::ToString([Convert]::FromBase64String($dependency.integrity.Substring(7))).Replace('-', '')
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash -cne $expected) { throw 'Locked js-yaml digest mismatch' }
          New-Item -ItemType Directory -Force app/node_modules | Out-Null
          tar -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the locked js-yaml test dependency' }
          Move-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'package') -Destination app/node_modules/js-yaml
      - name: Run the official payload static and contract tests
        shell: pwsh
        run: node --test tests/official-pure-portable.test.mjs tests/official-pure-alpha-workflow.test.mjs tests/official-desktop-channel-workflow.test.mjs tests/official-pure-package-smoke.test.mjs tests/official-desktop-channel.test.mjs
  package:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - id: select
        name: Read the production channel and select an accepted official version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REQUESTED_VERSION) {
            $selection = node experiments/official-payload/channel/select-candidate.mjs $env:REQUESTED_VERSION 'build/orch-080/T32'
          } else {
            $selection = node experiments/official-payload/channel/select-candidate.mjs 'build/orch-080/T32'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the production qualified channel index' }
          $candidate = Get-Content -LiteralPath 'build/orch-080/T32/candidate.json' -Raw | ConvertFrom-Json
          "version=$($candidate.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - id: installer
        name: Download and validate the selected official installer
        uses: ./.github/actions/official-payload-stage
        with:
          candidate: build/orch-080/T32/candidate.json
          installer: ${{ runner.temp }}/official-alpha-installer.exe
      - name: Package the pure portable layout against the production channel
        shell: pwsh
        env:
          INSTALLER: ${{ steps.installer.outputs.installer }}
          EXPECTED_OFFICIAL_VERSION: ${{ (inputs.stable_candidate || inputs.rc_candidate) && steps.select.outputs.version || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $urls = node experiments/official-payload/channel/constants.mjs | ConvertFrom-Json
          if (-not $urls.channelBaseUrl -or -not $urls.indexUrl) { throw 'Production channel constants are unavailable' }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw 'GitHub Windows runner 7-Zip is required' }
          ./experiments/official-payload/package-pure.ps1 `
            -Installer $env:INSTALLER `
            -Output 'build/orch-080/T32/package' `
            -SevenZip $sevenZip `
            -FeedUrl $urls.channelBaseUrl `
            -IndexUrl $urls.indexUrl `
            -PortableVersion $env:PORTABLE_VERSION `
            -ExpectedOfficialVersion $env:EXPECTED_OFFICIAL_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Pure portable packaging failed' }
          $archive = 'build/orch-080/T32/DSH-Portable-${{ env.PORTABLE_VERSION }}-windows-x64.zip'
          Compress-Archive -Path 'build/orch-080/T32/package/*' -DestinationPath $archive -CompressionLevel Optimal
          ./experiments/official-payload/package-pure.ps1 `
            -Bootstrap `
            -Output 'build/orch-080/T32/package-lite' `
            -SevenZip $sevenZip `
            -FeedUrl $urls.channelBaseUrl `
            -IndexUrl $urls.indexUrl `
            -PortableVersion $env:PORTABLE_VERSION `
            -ExpectedOfficialVersion $env:EXPECTED_OFFICIAL_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Lite portable packaging failed' }
          $liteRoot = 'build/orch-080/T32/package-lite'
          $liteFiles = @(Get-ChildItem -LiteralPath $liteRoot -Recurse -File)
          $liteBytes = [long](($liteFiles | Measure-Object Length -Sum).Sum)
          if ($liteBytes -ge 40MB) { throw "Lite package exceeds the 40 MiB limit: $liteBytes bytes" }
          foreach ($required in @('DeepSeek Harness Portable.exe', 'launcher/apply-update.ps1', 'launcher/Payload.psm1', 'launcher/follow.json', 'launcher/bootstrap.json', 'launcher/7z.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $liteRoot $required) -PathType Leaf)) { throw "Lite package is missing $required" }
          }
          if ((Test-Path -LiteralPath (Join-Path $liteRoot 'app/current.json')) -or @(Get-ChildItem -LiteralPath (Join-Path $liteRoot 'app') -Directory).Count -ne 0) { throw 'Lite package contains a preinstalled official app' }
          $liteArchive = 'build/orch-080/T32/DSH-Portable-${{ env.PORTABLE_VERSION }}-windows-x64-lite.zip'
          Compress-Archive -Path 'build/orch-080/T32/package-lite/*' -DestinationPath $liteArchive -CompressionLevel Optimal
          [IO.File]::WriteAllText('build/orch-080/T32/lite-package-size.txt', ($liteBytes.ToString() + "`n"), [Text.Encoding]::ASCII)
      - name: Smoke first and second startup, plugin-free config, and moved root
        if: inputs.smoke == 'all' || inputs.smoke == 'full'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./experiments/official-payload/e2e/smoke-portable-package.ps1 `
            -Archive 'build/orch-080/T32/DSH-Portable-${{ env.PORTABLE_VERSION }}-windows-x64.zip' `
            -WorkRoot 'build/orch-080/T32/smoke-root' `
            -EvidenceRoot 'build/orch-080/T32/evidence'
      - name: Smoke lite bootstrap install from the accepted channel and official CDN
        if: inputs.smoke == 'all' || inputs.smoke == 'lite'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./experiments/official-payload/e2e/smoke-portable-package.ps1 `
            -Archive 'build/orch-080/T32/DSH-Portable-${{ env.PORTABLE_VERSION }}-windows-x64-lite.zip' `
            -WorkRoot 'build/orch-080/T32/smoke-lite-root' `
            -EvidenceRoot 'build/orch-080/T32/lite-evidence' `
            -Bootstrap
      - name: Smoke lite first install from the already downloaded signed installer
        if: inputs.smoke == 'all'
        shell: powershell
        env:
          INSTALLER: ${{ steps.installer.outputs.installer }}
        run: |
          ./experiments/official-payload/e2e/smoke-portable-package.ps1 `
            -Archive 'build/orch-080/T32/DSH-Portable-${{ env.PORTABLE_VERSION }}-windows-x64-lite.zip' `
            -WorkRoot 'build/orch-080/T32/smoke-lite-local-root' `
            -EvidenceRoot 'build/orch-080/T32/lite-evidence/local-first-install' `
            -Bootstrap -LocalInstallerFile $env:INSTALLER
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: official-pure-${{ env.PORTABLE_VERSION }}-lite-smoke-evidence
          path: build/orch-080/T32/lite-evidence/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: official-pure-${{ env.PORTABLE_VERSION }}-package-smoke-evidence
          path: build/orch-080/T32/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Create checksums and source provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Get-Content -LiteralPath 'build/orch-080/T32/candidate.json' -Raw | ConvertFrom-Json
          $archive = 'build/orch-080/T32/DSH-Portable-${{ env.PORTABLE_VERSION }}-windows-x64.zip'
          $liteArchive = 'build/orch-080/T32/DSH-Portable-${{ env.PORTABLE_VERSION }}-windows-x64-lite.zip'
          $launcher = 'build/orch-080/T32/package/DeepSeek Harness Portable.exe'
          $zipHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $liteZipHash = (Get-FileHash -LiteralPath $liteArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          $launcherHash = (Get-FileHash -LiteralPath $launcher -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$zipHash  DSH-Portable-${{ env.PORTABLE_VERSION }}-windows-x64.zip", "$liteZipHash  DSH-Portable-${{ env.PORTABLE_VERSION }}-windows-x64-lite.zip", "$launcherHash  DeepSeek Harness Portable.exe") | Set-Content -LiteralPath 'build/orch-080/T32/checksums.txt' -Encoding ascii
          $source = @("# DSH-Portable $env:PORTABLE_VERSION source", '', "- Official desktop version: $($candidate.version)", "- Official installer URL: $($candidate.installerUrl)", "- Official installer SHA-512 (base64): $($candidate.sha512)", "- Full package SHA-256: $zipHash", "- Lite package SHA-256: $liteZipHash", "- Launcher SHA-256: $launcherHash", "- Source commit: $env:GITHUB_SHA", '', 'The lite package downloads the accepted official desktop from the official CDN on first launch. Both packages use the separate official Desktop update channel.')
          $source | Set-Content -LiteralPath 'build/orch-080/T32/SOURCE.md' -Encoding utf8
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: official-pure-${{ env.PORTABLE_VERSION }}-draft-assets
          path: |
            build/orch-080/T32/DSH-Portable-${{ env.PORTABLE_VERSION }}-windows-x64.zip
            build/orch-080/T32/DSH-Portable-${{ env.PORTABLE_VERSION }}-windows-x64-lite.zip
            build/orch-080/T32/checksums.txt
            build/orch-080/T32/SOURCE.md
            build/orch-080/T32/lite-package-size.txt
            build/orch-080/T32/smoke-root-moved/smoke-report.json
            build/orch-080/T32/smoke-root-moved/smoke-page.json
          if-no-files-found: warn
          retention-days: 14

  draft-release:
    needs: package
    # Ordinary manual runs retain Actions artifacts without creating or updating a draft.
    # Explicit publication still requires both real package smokes.
    if: inputs.publish_draft == true && inputs.smoke == 'all' && !inputs.stable_candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v8
        with:
          name: official-pure-${{ env.PORTABLE_VERSION }}-draft-assets
          path: release-input
      - name: Verify package hashes and create or update the prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ env.PORTABLE_VERSION }}
          RELEASE_NAME: DSH-Portable ${{ env.PORTABLE_VERSION }} — Pure portable
        run: |
          set -euo pipefail
          (cd release-input && head -n 2 checksums.txt | sha256sum --strict --check)
          # Draft releases have no tag yet, so the tags endpoint cannot see them: search the release list instead.
          # A draft whose tag does not exist yet is reported as "untagged-..."; match it by title too.
          EXISTING=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" or (.draft and .name == \"$RELEASE_NAME\")) | [.id, .draft] | join(\" \")" | head -n 1)
          if [ -z "$EXISTING" ]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title "$RELEASE_NAME" --notes-file release-input/SOURCE.md
          else
            RELEASE_ID=${EXISTING%% *}
            DRAFT=${EXISTING##* }
            if [ "$DRAFT" != true ]; then echo "Refusing to mutate an existing public $RELEASE_TAG release" >&2; exit 1; fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" -f name="$RELEASE_NAME" -F body=@release-input/SOURCE.md -F draft=true -F prerelease=true > /dev/null
          fi
          node scripts/upload-release-assets.mjs "$RELEASE_TAG" release-input/DSH-Portable-${{ env.PORTABLE_VERSION }}-windows-x64.zip release-input/DSH-Portable-${{ env.PORTABLE_VERSION }}-windows-x64-lite.zip release-input/checksums.txt release-input/SOURCE.md --mutable
