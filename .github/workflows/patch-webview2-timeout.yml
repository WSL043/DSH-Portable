name: Apply WebView2 timeout source patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/0.2.5-windows-upgrade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch the two workspace navigation waits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('launcher/windows/DSH-Portable.cs')
          source = path.read_text(encoding='utf-8')

          constant_anchor = '        private const int DwmwaWindowCornerPreference = 33;'
          constant_line = constant_anchor + '\n        private const int WorkspaceNavigationTimeoutMs = 60000;'
          if 'WorkspaceNavigationTimeoutMs = 60000' not in source:
              assert source.count(constant_anchor) == 1, 'unexpected DWM timeout anchor count'
              source = source.replace(constant_anchor, constant_line)

          old_delay = 'Task.Delay(30000)'
          new_delay = 'Task.Delay(WorkspaceNavigationTimeoutMs)'
          if old_delay in source:
              assert source.count(old_delay) == 2, 'unexpected 30-second navigation delay count'
              source = source.replace(old_delay, new_delay)
          assert source.count(new_delay) == 2, 'expected exactly two workspace navigation waits'

          old_zh = '30 秒内打开'
          if old_zh in source:
              assert source.count(old_zh) == 2, 'unexpected Chinese timeout message count'
              source = source.replace(old_zh, '60 秒内打开')

          old_en = 'within 30 seconds'
          if old_en in source:
              assert source.count(old_en) == 2, 'unexpected English timeout message count'
              source = source.replace(old_en, 'within 60 seconds')

          assert '30 秒内打开' not in source
          assert 'within 30 seconds' not in source
          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit the source-only change
        shell: bash
        run: |
          if git diff --quiet -- launcher/windows/DSH-Portable.cs; then
            echo 'WebView2 source timeout is already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add launcher/windows/DSH-Portable.cs
          git commit -m 'fix(windows): allow 60 seconds for WebView2 navigation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
