name: Candidate intake contract

on:
  push:
    branches:
      - fix/official-candidate-intake

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app --ignore-scripts
      - run: npm test
      - name: Resolve the live official candidate through npm and its immutable GitHub tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-preview-upstream.mjs
