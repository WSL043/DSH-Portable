name: Candidate intake contract

on:
  push:
    branches:
      - fix/official-candidate-intake

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app --ignore-scripts
      - run: npm test
      - name: Resolve the live official candidate through npm and its immutable GitHub tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/update-preview-upstream.mjs | tee candidate-state.json
          grep '"changed": true' candidate-state.json
          node - <<'NODE'
          const lock = require('./upstream.preview.lock.json')
          if (lock.dsh.version === '0.1.2-alpha.4') throw new Error('live candidate did not advance the reviewed lock')
          if (!/-(?:alpha|beta|rc)(?:\.|$)/.test(lock.dsh.version)) throw new Error(`unexpected candidate train: ${lock.dsh.version}`)
          if (lock.dsh.tag !== `dsh-v${lock.dsh.version}`) throw new Error('candidate tag/version mismatch')
          NODE
