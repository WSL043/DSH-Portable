name: WIP market branch-ref patch

on:
  push:
    branches:
      - fix/market-140-branch-ref

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor == 'WSL043'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app --ignore-scripts
      - name: Apply the reviewed branch-ref fix
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          sources = Path('app/vendor/dsh-portable-plugin-market/src/sources.ts')
          text = sources.read_text()
          marker = '''/**
           * The pnpm install target for a registry entry. Registry tarballs beat
          '''
          if text.count(marker) != 1:
              raise SystemExit('sources.ts: insertion marker changed')
          helpers = r'''/**
           * Durable GitHub target to use for an explicit update.
           *
           * A floating branch/tag is part of the user's source selection and
           * must survive an update. A 40-hex commit is an immutable install pin,
           * so updating deliberately drops it and re-resolves the same repository
           * (while keeping a monorepo path selector).
           */
          export function githubUpdateTarget(spec: string): string {
            if (!spec.startsWith('github:')) return spec
            const fragmentAt = spec.indexOf('#')
            if (fragmentAt === -1) return spec
            const repo = spec.slice(0, fragmentAt)
            let ref: string | null = null
            let subpath: string | null = null
            for (const selector of spec.slice(fragmentAt + 1).split('&')) {
              if (selector.startsWith('path:/')) {
                const candidate = selector.slice('path:/'.length)
                if (subpath !== null || !validSubpath(candidate)) return repo
                subpath = candidate
                continue
              }
              if (selector === '' || /^[0-9a-f]{40}$/i.test(selector)) continue
              if (ref !== null) return repo
              ref = selector
            }
            const selectors = [
              ...(ref === null ? [] : [ref]),
              ...(subpath === null ? [] : [`path:/${subpath}`]),
            ]
            return selectors.length === 0 ? repo : `${repo}#${selectors.join('&')}`
          }

          /** Branch/tag selected by a github: spec for update comparison. */
          export function githubRefOfTarget(spec: string): string | null {
            if (!spec.startsWith('github:')) return null
            const fragmentAt = spec.indexOf('#')
            if (fragmentAt === -1) return null
            for (const selector of spec.slice(fragmentAt + 1).split('&')) {
              if (selector === '' || selector.startsWith('path:/')) continue
              if (/^[0-9a-f]{40}$/i.test(selector) || selector.startsWith('semver:')) return null
              return selector
            }
            return null
          }

          /** Exact rollback target: captured commit plus the original monorepo subpath. */
          export function githubPinnedTarget(spec: string, commit: string): string {
            if (!spec.startsWith('github:') || !/^[0-9a-f]{40}$/i.test(commit)) return spec
            const floating = githubUpdateTarget(spec)
            const fragmentAt = floating.indexOf('#')
            const repo = fragmentAt === -1 ? floating : floating.slice(0, fragmentAt)
            let subpath: string | null = null
            if (fragmentAt !== -1) {
              for (const selector of floating.slice(fragmentAt + 1).split('&')) {
                if (!selector.startsWith('path:/')) continue
                const candidate = selector.slice('path:/'.length)
                if (validSubpath(candidate)) subpath = candidate
              }
            }
            return `${repo}#${commit}${subpath === null ? '' : `&path:/${subpath}`}`
          }

          '''
          sources.write_text(text.replace(marker, helpers + marker, 1))

          replace_once(
              'app/vendor/dsh-portable-plugin-market/src/updates.ts',
              "import { profileDir, readInstalled, readInstalledVersion, readLockCommits } from './profile.ts'\n",
              "import { profileDir, readInstalled, readInstalledVersion, readLockCommits } from './profile.ts'\nimport { githubRefOfTarget } from './sources.ts'\n",
          )
          replace_once(
              'app/vendor/dsh-portable-plugin-market/src/updates.ts',
              "export function parseGitHeadAdvertisement(payload: string): string | null {\n  return /([0-9a-f]{40}) HEAD/.exec(payload)?.[1] ?? null\n}\n\n",
              "export function parseGitHeadAdvertisement(payload: string): string | null {\n  return /([0-9a-f]{40}) HEAD/.exec(payload)?.[1] ?? null\n}\n\n/** Resolve a selected branch/tag from git's ref advertisement, or HEAD when no ref is selected. */\nexport function parseGitRefAdvertisement(payload: string, ref?: string): string | null {\n  if (ref === undefined) return parseGitHeadAdvertisement(payload)\n  const quoted = ref.replace(/[.*+?^${}()|[\\]\\\\]/gu, String.raw`\\$&`)\n  for (const namespace of ['heads', 'tags']) {\n    const found = new RegExp(String.raw`([0-9a-f]{40}) refs/${namespace}/${quoted}(?![^\\s])`, 'u').exec(payload)\n    if (found !== null) return found[1]!\n  }\n  return null\n}\n\n",
          )
          replace_once(
              'app/vendor/dsh-portable-plugin-market/src/updates.ts',
              'async function fetchGitHead(repo: string): Promise<string | null> {',
              'async function fetchGitHead(repo: string, ref?: string): Promise<string | null> {',
          )
          replace_once(
              'app/vendor/dsh-portable-plugin-market/src/updates.ts',
              '    return parseGitHeadAdvertisement(await response.text())',
              '    return parseGitRefAdvertisement(await response.text(), ref)',
          )
          replace_once(
              'app/vendor/dsh-portable-plugin-market/src/updates.ts',
              '        const latest = await fetchGitHead(gh[1])',
              '        const latest = await fetchGitHead(gh[1], githubRefOfTarget(spec) ?? undefined)',
          )

          replace_once(
              'app/vendor/dsh-portable-plugin-market/src/routes.ts',
              "import { findInstalledAlias, gitAllowBuildsKey, installTargetFor, verifiedNpmTargetFor } from './sources.ts'",
              "import { findInstalledAlias, gitAllowBuildsKey, githubPinnedTarget, githubUpdateTarget, installTargetFor, verifiedNpmTargetFor } from './sources.ts'",
          )
          replace_once(
              'app/vendor/dsh-portable-plugin-market/src/routes.ts',
              "            const target = isGit ? spec.replace(/#.*$/, '') : `${name}@${tag}`",
              "            const target = isGit ? githubUpdateTarget(spec) : `${name}@${tag}`",
          )
          replace_once(
              'app/vendor/dsh-portable-plugin-market/src/routes.ts',
              "    const add = await runPlugin(config.profile, ['add', RELEASE_AGE_OVERRIDE, `${target}#${beforeCommit}`])",
              "    const add = await runPlugin(config.profile, ['add', RELEASE_AGE_OVERRIDE, githubPinnedTarget(target, beforeCommit)])",
          )
          PY
      - name: Run regression and repository contracts
        run: npm test
      - name: Commit the qualified fix to the work branch
        shell: bash
        run: |
          git config user.name 'WSL043'
          git config user.email '100819018+WSL043@users.noreply.github.com'
          git add app/vendor/dsh-portable-plugin-market/src/sources.ts \
                  app/vendor/dsh-portable-plugin-market/src/updates.ts \
                  app/vendor/dsh-portable-plugin-market/src/routes.ts
          git diff --cached --check
          git commit -m 'fix: preserve GitHub branch refs across plugin updates'
          git push origin HEAD:fix/market-140-branch-ref
