name: Publish tested release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build and smoke test run ID for main
        required: true
        type: string
      tag:
        description: Stable vX.Y.Z or candidate vX.Y.Z-rc.N tag matching package.json
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Resolve the release channel from the canonical product version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/version-policy.mjs "$(node -p "require('./package.json').version")" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Require a successful main build for this commit and version
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_branch)" = main
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_sha)" = "$GITHUB_SHA"
          test "$RELEASE_TAG" = "${{ steps.version.outputs.tag }}"
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: artifacts
      - name: Stage a small user release and a separate update channel
        run: node scripts/stage-release-assets.mjs artifacts release-staging
      - name: Render immutable download links for this release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/render-release-notes.mjs templates/RELEASE-NOTES.md release-staging/RELEASE-NOTES.md "$RELEASE_TAG"
      - name: Publish machine-readable update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view update-channel-stable >/dev/null 2>&1 || \
            gh release create update-channel-stable --prerelease --title "DSH-Portable update channel" --notes "Machine-readable update assets used by tested DSH-Portable builds."
          gh release upload update-channel-stable release-staging/update-assets/* --clobber
      - name: Publish curated user downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || {
              echo "Refusing to mutate an already published release: $RELEASE_TAG" >&2
              exit 1
            }
          else
            FLAGS=(--draft)
            if [ "$PRERELEASE" = true ]; then FLAGS+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "DSH-Portable ${RELEASE_TAG#v}" --notes-file release-staging/RELEASE-NOTES.md "${FLAGS[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-staging/user-assets/* --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
