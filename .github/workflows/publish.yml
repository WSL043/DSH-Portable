name: Publish tested release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build and smoke test run ID for main
        required: true
        type: string
      tag:
        description: Stable vX.Y.Z or candidate vX.Y.Z-rc.N tag matching package.json
        required: true
        type: string

permissions:
  actions: read
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Refuse a release with an outdated bundled session manager
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-default-plugin.mjs --check
      - name: Resolve the release channel from the canonical product version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/version-policy.mjs "$(node -p "require('./package.json').version")" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Require a successful main build for this commit and version
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_branch)" = main
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_sha)" = "$GITHUB_SHA"
          test "$RELEASE_TAG" = "${{ steps.version.outputs.tag }}"
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: artifacts
      - name: Stage a small user release and a separate update channel
        run: node scripts/stage-release-assets.mjs artifacts release-staging "${{ steps.version.outputs.channel }}"
      - name: Record the exact release qualification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > release-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > release-jobs.json
          node scripts/create-release-evidence.mjs \
            release-staging/user-assets \
            release-run.json \
            release-jobs.json \
            release-qualification.json \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" \
            "$RELEASE_TAG"
      - name: Sign the user download provenance with GitHub attestations
        uses: actions/attest@v4
        with:
          subject-checksums: release-staging/user-assets/checksums.txt
      - name: Sign the cross-platform qualification result
        uses: actions/attest@v4
        with:
          subject-checksums: release-staging/user-assets/checksums.txt
          predicate-type: https://in-toto.io/attestation/test-result/v0.1
          predicate-path: release-qualification.json
      - name: Render immutable download links for this release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/render-release-notes.mjs templates/RELEASE-NOTES.md release-staging/RELEASE-NOTES.md "$RELEASE_TAG"
      - name: Publish curated user downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || {
              echo "Refusing to mutate an already published release: $RELEASE_TAG" >&2
              exit 1
            }
          else
            FLAGS=(--draft)
            if [ "$PRERELEASE" = true ]; then FLAGS+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "DSH-Portable ${RELEASE_TAG#v}" --notes-file release-staging/RELEASE-NOTES.md "${FLAGS[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-staging/user-assets/* --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
      - name: Publish the isolated machine-readable update channel
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_CHANNEL_TAG: ${{ steps.version.outputs.updateChannelTag }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          gh release view "$UPDATE_CHANNEL_TAG" >/dev/null 2>&1 || \
            gh release create "$UPDATE_CHANNEL_TAG" --prerelease --title "DSH-Portable $RELEASE_CHANNEL update channel" --notes "Machine-readable update assets used by tested DSH-Portable builds."
          gh release upload "$UPDATE_CHANNEL_TAG" release-staging/update-assets/* --clobber
          if [ "$RELEASE_CHANNEL" = stable ]; then
            gh release view update-channel-candidate >/dev/null 2>&1 || \
              gh release create update-channel-candidate --prerelease --title "DSH-Portable candidate update channel" --notes "Machine-readable candidate updates and stable promotion assets."
            gh release upload update-channel-candidate release-staging/update-assets/* --clobber
          fi
      - name: Publish the verified DeepSeek Harness core channel
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_UPDATE_CHANNEL_TAG: update-channel-core-${{ steps.version.outputs.channel }}
        run: |
          if [ "${{ steps.version.outputs.channel }}" = "stable" ]; then
            CORE_TITLE="DSH 内核更新通道（无需下载） / Core update channel"
            CORE_NOTES="供 DSH-Portable 自动更新已通过兼容性验证的官方 DeepSeek Harness 内核使用。普通用户无需下载这里的文件，请从 Latest 下载 DSH-Portable。 / Used by DSH-Portable to deliver verified official DeepSeek Harness core updates. Users do not need these assets; download DSH-Portable from Latest."
          else
            CORE_TITLE="DSH 候选内核通道（无需下载） / Candidate core channel"
            CORE_NOTES="供 DSH-Portable 的候选内核兼容性验证使用。普通用户无需下载这里的文件，请从 Latest 下载 DSH-Portable。 / Used for DSH-Portable candidate core compatibility validation. Users do not need these assets; download DSH-Portable from Latest."
          fi
          gh release view "$CORE_UPDATE_CHANNEL_TAG" >/dev/null 2>&1 || \
            gh release create "$CORE_UPDATE_CHANNEL_TAG" --prerelease --title "$CORE_TITLE" --notes "$CORE_NOTES"
          gh release upload "$CORE_UPDATE_CHANNEL_TAG" release-staging/engine-update-assets/* --clobber
