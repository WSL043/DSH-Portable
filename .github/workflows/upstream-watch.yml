name: Watch official DSH

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - id: upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-upstream.mjs
      - name: Run the complete repository contract before proposing an update
        if: steps.upstream.outputs.changed == 'true'
        continue-on-error: true
        run: npm test
      - name: Create or refresh the tested candidate pull request
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
        run: |
          BRANCH=automation/dsh-upstream
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C "$BRANCH"
          git add app/package.json app/package-lock.json upstream.lock.json
          git commit -m "chore: test official DSH ${VERSION} candidate"
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          BODY=$(mktemp)
          printf '%s\n' \
            'Automated candidate from the official DeepSeek Harness preview channel.' \
            '' "- npm package: \`${VERSION}\`" "- official master: \`${COMMIT}\`" \
            '' 'This pull request is not auto-merged or auto-released. The normal Windows and macOS product CI remains the release gate.' > "$BODY"
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "chore: test official DSH ${VERSION} candidate" --body-file "$BODY"
          else
            gh pr create --head "$BRANCH" --base main --title "chore: test official DSH ${VERSION} candidate" --body-file "$BODY"
          fi
