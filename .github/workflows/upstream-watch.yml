name: Watch official DSH

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - id: default_plugin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-default-plugin.mjs
      - id: upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-upstream.mjs
      - id: market
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-market-upstream.mjs
      - name: Create or refresh the plugin-market review issue
        if: steps.market.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.market.outputs.pinned }}
          LATEST: ${{ steps.market.outputs.latest }}
          RELEASE_URL: ${{ steps.market.outputs.url }}
        run: |
          TITLE="Review dsh-market ${LATEST} for Portable"
          BODY=$(mktemp)
          printf '%s\n' \
            'A newer dsh-market release is available for a selective Portable review.' \
            '' "- reviewed baseline: \`${PINNED}\`" "- latest release: [\`${LATEST}\`](${RELEASE_URL})" \
            '' 'Use .github/PLUGIN-MARKET-UPSTREAM.md as the decision matrix. Port only applicable behavior with tests; do not merge the upstream working tree or auto-release.' > "$BODY"
          ISSUE=$(gh issue list --state open --search "Review dsh-market in:title" --json number,title --jq '.[] | select(.title | startswith("Review dsh-market")) | .number' | head -n 1)
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --title "$TITLE" --body-file "$BODY" --add-assignee WSL043
          else
            gh issue create --title "$TITLE" --body-file "$BODY" --assignee WSL043
          fi
      - name: Summarize source-only upstream activity
        if: steps.upstream.outputs.changed != 'true' && steps.upstream.outputs.source_changed == 'true'
        env:
          COMMIT: ${{ steps.upstream.outputs.source_commit }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          printf '%s\n' \
            '### Official DSH source activity observed' \
            '' "- installable npm package remains: \`${VERSION}\`" \
            "- official master is now: \`${COMMIT}\`" \
            '' 'No candidate issue was created because there is no new installable package.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run the complete repository contract before proposing an update
        if: steps.upstream.outputs.changed == 'true'
        run: npm test
      - name: Package the tested candidate without creating a branch
        if: steps.upstream.outputs.changed == 'true'
        run: git diff --binary -- app/package.json app/package-lock.json app/vendor/dsh-portable-plugin-market/package.json launcher/default-plugins.mjs upstream.lock.json > official-dsh-candidate.patch
      - name: Upload the tested candidate
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: official-dsh-${{ steps.upstream.outputs.version }}-candidate
          path: official-dsh-candidate.patch
          if-no-files-found: error
          retention-days: 30
      - name: Create or refresh the tested candidate issue
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Official DSH ${VERSION} candidate"
          BODY=$(mktemp)
          printf '%s\n' \
            'Automated candidate from the official DeepSeek Harness preview channel.' \
            '' "- npm package: \`${VERSION}\`" "- matching official tag commit: \`${COMMIT}\`" \
            "- tested candidate patch: ${RUN_URL} (Artifacts)" \
            '' 'This issue is not auto-merged or auto-released. The candidate still requires product adaptation and the normal Windows, macOS, and Linux release gate.' > "$BODY"
          ISSUE=$(gh issue list --state open --search "${TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --title "$TITLE" --body-file "$BODY" --add-assignee WSL043
          else
            gh issue create --title "$TITLE" --body-file "$BODY" --assignee WSL043
          fi
