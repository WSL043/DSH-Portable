name: Dependency intake

on:
  repository_dispatch:
    types: [dependency-released]
  schedule:
    # GitHub cannot subscribe to release events from repositories we do not
    # control. Polling only opens a verified intake PR; it never publishes.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Dependency source that prompted the intake
        required: false
        type: choice
        options:
          - all
          - official-dsh
          - dsh-market
        default: all
      version:
        description: Optional release version for the run summary
        required: false
        type: string
      release_url:
        description: Optional canonical release URL for the run summary
        required: false
        type: string

concurrency:
  group: dependency-intake
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Record the intake signal
        env:
          SOURCE: ${{ github.event.client_payload.source || inputs.source || github.event_name }}
          VERSION: ${{ github.event.client_payload.version || inputs.version || '' }}
          RELEASE_URL: ${{ github.event.client_payload.release_url || inputs.release_url || '' }}
        run: |
          printf '%s\n' \
            '### Dependency intake' \
            '' "- signal: \`${SOURCE}\`" "- announced version: \`${VERSION:-not supplied}\`" \
            "- announced release: ${RELEASE_URL:-not supplied}" \
            '' 'Canonical registries and immutable releases are verified below; the signal itself is never trusted as package evidence.' >> "$GITHUB_STEP_SUMMARY"
      - id: upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-upstream.mjs
      - id: market
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-market-upstream.mjs
      - id: proposal
        name: Skip an identical dependency proposal awaiting review
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=automation/verified-dependencies
          PR=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            git fetch --no-tags origin "$BRANCH:refs/remotes/origin/$BRANCH"
            if git diff --quiet "origin/$BRANCH" -- app/package.json app/package-lock.json app/vendor/dsh-portable-plugin-market/package.json upstream.lock.json; then
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              echo 'An identical dependency proposal is awaiting manual review; no new commit or product qualification was requested.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Create or refresh the plugin-market review issue
        if: steps.market.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.market.outputs.pinned }}
          LATEST: ${{ steps.market.outputs.latest }}
          RELEASE_URL: ${{ steps.market.outputs.url }}
        run: |
          set -euo pipefail
          TITLE="Dependency intake: dsh-market"
          MACHINE=$(mktemp)
          BODY=$(mktemp)
          STATE=$(mktemp)
          printf '%s\n' \
            '<!-- dsh-market-monitor:start -->' \
            "- reviewed upstream baseline: \`${PINNED}\`" \
            "- observed latest release: [\`${LATEST}\`](${RELEASE_URL})" \
            '- review: manual review and merge are required by a human; this workflow never merges or releases.' \
            '- release cadence: accepted fixes follow the next planned DSH-Portable release.' \
            '<!-- dsh-market-monitor:end -->' > "$MACHINE"
          ISSUE=$(gh issue list --state open --search "dsh-market in:title" --json number,title --jq '[.[] | select(.title == "Dependency intake: dsh-market" or (.title | startswith("Review dsh-market")))][0].number // empty')
          if [ -n "$ISSUE" ]; then
            ISSUE_DATA=$(mktemp)
            gh issue view "$ISSUE" --json title,body,assignees > "$ISSUE_DATA"
            TARGET_TITLE="$TITLE" TARGET_ASSIGNEE="WSL043" node --input-type=module - "$ISSUE_DATA" "$MACHINE" "$BODY" "$STATE" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const [issuePath, machinePath, bodyPath, statePath] = process.argv.slice(2)
          const issue = JSON.parse(readFileSync(issuePath, 'utf8'))
          const existing = String(issue.body ?? '')
          const machine = readFileSync(machinePath, 'utf8').trimEnd()
          const startMarker = '<!-- dsh-market-monitor:start -->'
          const endMarker = '<!-- dsh-market-monitor:end -->'
          const start = existing.indexOf(startMarker)
          const end = existing.indexOf(endMarker, start >= 0 ? start + startMarker.length : 0)
          const body = start >= 0 && end >= start
            ? `${existing.slice(0, start)}${machine}${existing.slice(end + endMarker.length)}`
            : (existing.trimEnd() ? `${existing.trimEnd()}\n\n${machine}\n` : `${machine}\n`)

          writeFileSync(bodyPath, body)
          writeFileSync(statePath, JSON.stringify({
            bodyChanged: body !== existing,
            titleChanged: issue.title !== process.env.TARGET_TITLE,
            assigned: Array.isArray(issue.assignees)
              && issue.assignees.some(({ login }) => login === process.env.TARGET_ASSIGNEE),
          }))
          NODE
            EDIT_ARGS=()
            if [ "$(jq -r '.bodyChanged' "$STATE")" = true ]; then EDIT_ARGS+=(--body-file "$BODY"); fi
            if [ "$(jq -r '.titleChanged' "$STATE")" = true ]; then EDIT_ARGS+=(--title "$TITLE"); fi
            if [ "${#EDIT_ARGS[@]}" -gt 0 ]; then gh issue edit "$ISSUE" "${EDIT_ARGS[@]}"; fi
            if [ "$(jq -r '.assigned' "$STATE")" != true ]; then gh issue edit "$ISSUE" --add-assignee WSL043; fi
          else
            printf '%s\n' \
              'Rolling review inbox for dsh-market changes that may apply to Portable.' \
              '' 'Manual review and merge are required by a human; the upstream working tree is never merged automatically.' \
              'An accepted fix follows the DSH-Portable release cadence; an upstream release never triggers a Portable release.' \
              '' 'Use .github/PLUGIN-MARKET-UPSTREAM.md as the decision matrix. Port only applicable behavior with a failing test first.' \
              '' 'Accepted fixes accumulate on main and ship with the next planned Portable release unless they close a blocking security, installation, or data-safety defect.' > "$BODY"
            cat "$MACHINE" >> "$BODY"
            gh issue create --title "$TITLE" --body-file "$BODY" --assignee WSL043
          fi
      - name: Summarize source-only upstream activity
        if: steps.upstream.outputs.changed != 'true' && steps.upstream.outputs.source_changed == 'true'
        env:
          COMMIT: ${{ steps.upstream.outputs.source_commit }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          printf '%s\n' \
            '### Official DSH source activity observed' \
            '' "- installable npm package remains: \`${VERSION}\`" \
            "- official master is now: \`${COMMIT}\`" \
            '' 'No candidate issue was created because there is no new installable package.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run the complete repository contract before proposing an update
        if: steps.proposal.outputs.changed == 'true'
        run: |
          npm ci --prefix app --ignore-scripts
          npm test
      - name: Open or refresh the short-lived verified dependency pull request
        if: steps.proposal.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_VERSION: ${{ steps.upstream.outputs.version }}
          DSH_CHANGED: ${{ steps.upstream.outputs.changed }}
        run: |
          set -euo pipefail
          BRANCH=automation/verified-dependencies
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$BRANCH"
          git add app/package.json app/package-lock.json app/vendor/dsh-portable-plugin-market/package.json upstream.lock.json
          git commit -m "chore: verify current DSH dependencies"
          git push --force origin "$BRANCH"
          BODY=$(mktemp)
          cat > "$BODY" <<EOF
          Keeps the packaged dependency closure current without coupling it to a DSH-Portable feature release.

          - DeepSeek Harness: ${DSH_VERSION} (changed: ${DSH_CHANGED})

          Manual review and merge are required by a human after the full Windows, macOS, and Linux product gate succeeds. This workflow never merges or publishes automatically.

          An approved dependency fix follows the DSH-Portable release cadence; upstream availability does not trigger a Portable release. Its branch may be deleted after a human merge.
          EOF
          PR=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "Keep verified DSH dependencies current" --body-file "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "Keep verified DSH dependencies current" --body-file "$BODY"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
