name: Official DSH candidate intake

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

concurrency:
  group: official-candidate-intake
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - id: preview
        name: Discover a newer official DSH candidate package and immutable source tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-preview-upstream.mjs
      - id: proposal
        name: Skip an identical official candidate awaiting review
        if: steps.preview.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=automation/official-preview
          PR=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            git fetch --no-tags origin "$BRANCH:refs/remotes/origin/$BRANCH"
            if git diff --quiet "origin/$BRANCH" -- upstream.preview.lock.json; then
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              echo 'This official candidate is already awaiting manual review; no new commit or product qualification was requested.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Run repository contracts before opening the review
        if: steps.proposal.outputs.changed == 'true'
        run: |
          npm ci --prefix app --ignore-scripts
          npm test
      - name: Open or refresh the official candidate review pull request
        if: steps.proposal.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TAG: ${{ steps.preview.outputs.selectedTag }}
          VERSION: ${{ steps.preview.outputs.version }}
          COMMIT: ${{ steps.preview.outputs.commit }}
        run: |
          set -euo pipefail
          BRANCH=automation/official-preview
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$BRANCH"
          git add upstream.preview.lock.json
          git commit -m "chore: review official DSH candidate ${VERSION}"
          git push --force origin "$BRANCH"
          BODY=$(mktemp)
          cat > "$BODY" <<EOF
          Reviews official DeepSeek Harness candidate ${VERSION} (npm tag: ${NPM_TAG}) at immutable commit ${COMMIT} for the Portable candidate channel.

          The full Windows, macOS, and Linux product qualification runs on this branch. Manual review and merge are required; this workflow never publishes or merges an upstream candidate automatically.
          EOF
          PR=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "Review official DSH candidate ${VERSION}" --body-file "$BODY" --add-assignee WSL043
          else
            gh pr create --base main --head "$BRANCH" --title "Review official DSH candidate ${VERSION}" --body-file "$BODY" --assignee WSL043
          fi
          gh workflow run ci.yml --ref "$BRANCH"
