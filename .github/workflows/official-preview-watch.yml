name: Official DSH candidate intake

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

concurrency:
  group: official-candidate-intake
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - id: review-branch
        name: Continue an open candidate review without replacing its commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=automation/official-preview
          PR=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            git fetch --no-tags origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -B "$BRANCH"
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
      - id: preview
        name: Discover a newer official DSH candidate package and immutable source tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-preview-upstream.mjs
      - name: Keep a rejected candidate quarantined
        if: steps.preview.outputs.blocked == 'true'
        run: |
          echo 'Official DSH ${{ steps.preview.outputs.rejectedVersion }} was previously rejected by historical-session qualification. Waiting for a new immutable upstream release.' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep an identical candidate review unchanged
        if: steps.preview.outputs.changed == 'false' && steps.preview.outputs.blocked != 'true'
        run: |
          echo 'No newer unshipped candidate needs review; no new commit or product qualification was requested.' >> "$GITHUB_STEP_SUMMARY"
      - id: intake
        name: Check and record same-shape historical migration candidates
        if: steps.preview.outputs.changed == 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.preview.outputs.version }}
        run: |
          set +e
          node scripts/intake-upstream-core.mjs "$VERSION" --lock upstream.preview.lock.json --record-shape --markdown intake-report.md > intake-output.txt 2>&1
          INTAKE_STATUS=$?
          cat intake-output.txt
          INTAKE_VERDICT=$(sed -n 's/^VERDICT=//p' intake-output.txt | tail -n 1)
          echo "status=$INTAKE_STATUS" >> "$GITHUB_OUTPUT"
          echo "verdict=$INTAKE_VERDICT" >> "$GITHUB_OUTPUT"
          exit "$INTAKE_STATUS"
      - name: Run repository contracts before opening the review
        id: contracts
        if: steps.preview.outputs.changed == 'true'
        continue-on-error: true
        run: |
          npm ci --prefix app --ignore-scripts
          npm test
      - name: Open or refresh the official candidate review pull request
        if: steps.preview.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TAG: ${{ steps.preview.outputs.selectedTag }}
          VERSION: ${{ steps.preview.outputs.version }}
          COMMIT: ${{ steps.preview.outputs.commit }}
          INTAKE_RESULT: ${{ steps.intake.outcome }}
          INTAKE_STATUS: ${{ steps.intake.outputs.status }}
          INTAKE_VERDICT: ${{ steps.intake.outputs.verdict }}
          CONTRACT_RESULT: ${{ steps.contracts.outcome }}
        run: |
          set -euo pipefail
          BRANCH=automation/official-preview
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add upstream.preview.lock.json config/historical-descriptor-versions.json
          git commit -m "chore: review official DSH candidate ${VERSION}"
          git push origin "$BRANCH"
          BODY=$(mktemp)
          cat > "$BODY" <<EOF
          Reviews official DeepSeek Harness candidate ${VERSION} (npm tag: ${NPM_TAG}) at immutable commit ${COMMIT} for the Portable candidate channel.

          Intake result: ${INTAKE_RESULT} (exit ${INTAKE_STATUS}); verdict: ${INTAKE_VERDICT}.

          Repository contracts: ${CONTRACT_RESULT}. Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Product qualification is dispatched only after repository contracts pass. A failed contract is an intake blocker, not a supported-version claim. Manual review and merge are required; this workflow never publishes or merges an upstream candidate automatically.
          EOF
          if [ -f intake-report.md ]; then
            printf '\n## Intake report\n\n' >> "$BODY"
            cat intake-report.md >> "$BODY"
          else
            printf '\nIntake report unavailable; inspect intake step result %s (exit %s).\n' "$INTAKE_RESULT" "$INTAKE_STATUS" >> "$BODY"
          fi
          if [[ "$INTAKE_VERDICT" == needs-review:* ]]; then
            INTAKE_REVIEW_INDEX=${INTAKE_VERDICT#needs-review:}
            printf '\n需要人工审查：第 %s 项。\n' "$INTAKE_REVIEW_INDEX" >> "$BODY"
          fi
          printf '\n稳定线采用前仍需人工接入记录。\n' >> "$BODY"
          PR=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "Review official DSH candidate ${VERSION}" --body-file "$BODY" --add-assignee WSL043
          else
            gh pr create --draft --base main --head "$BRANCH" --title "Review official DSH candidate ${VERSION}" --body-file "$BODY" --assignee WSL043
          fi
          if [ "$CONTRACT_RESULT" = success ]; then
            gh workflow run ci.yml --ref "$BRANCH"
          else
            echo 'Candidate recorded for review; failed contracts block product qualification and publication.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
