name: Build and smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub Actions syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate workflow semantics with actionlint
        run: |
          curl --fail --location --retry 3 --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint

  contracts:
    name: Contracts (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows-x64
          - runner: macos-15
            label: macos-arm64
          - runner: macos-15-intel
            label: macos-x64
          - runner: ubuntu-22.04
            label: linux-x64
          - runner: ubuntu-22.04-arm
            label: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - run: npm test

  windows-build:
    name: Build Windows base artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build Windows portable base
        shell: powershell
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-build
          path: |
            artifacts/DSH-Portable-windows-x64-offline.zip
            artifacts/DSH-Portable-windows-x64-offline.zip.sha256
            artifacts/DSH-Portable-windows-x64.exe
            artifacts/DSH-Portable-windows-x64.exe.sha256
            artifacts/portable-manifest.json
            artifacts/DSH-Portable-update-windows-x64.zip
            artifacts/DSH-Portable-update-windows-x64.zip.sha256
            artifacts/portable-update-windows-x64.json
          if-no-files-found: error
          compression-level: 0

  windows-inno-build:
    name: Build Windows ${{ matrix.label }}
    needs: windows-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: portable
            label: portable self-extractor
            artifact: windows-x64-extractor
            filename: DSH-Portable-windows-x64-offline.exe
          - kind: installer
            label: installer
            artifact: windows-x64-installer
            filename: DeepSeek-Herness-Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          path: artifacts
      - name: Install pinned Inno Setup 7 compiler
        shell: powershell
        run: |
          $Installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $CompilerRoot = Join-Path $env:RUNNER_TEMP 'is7'
          $ExpectedSha256 = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $Installer
          $ActualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $Installer).Hash.ToLowerInvariant()
          if ($ActualSha256 -ne $ExpectedSha256) { throw "Inno Setup SHA-256 mismatch: $ActualSha256" }
          $Arguments = '/SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /PORTABLE=1 /DIR="{0}"' -f $CompilerRoot
          $Process = Start-Process -FilePath $Installer -ArgumentList $Arguments -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Inno Setup installation failed with code $($Process.ExitCode)" }
          $Iscc = Join-Path $CompilerRoot 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $Iscc)) { throw "ISCC.exe is missing: $Iscc" }
          "ISCC_PATH=$Iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build ${{ matrix.label }} from the verified base archive
        shell: powershell
        run: ./scripts/build-windows-inno.ps1 -Kind '${{ matrix.kind }}' -Archive 'artifacts/DSH-Portable-windows-x64-offline.zip' -OutputDir 'artifacts' -IsccPath $env:ISCC_PATH
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            artifacts/${{ matrix.filename }}
            artifacts/${{ matrix.filename }}.sha256
          if-no-files-found: error
          compression-level: 0

  windows-update-smoke:
    name: Windows component update
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          path: artifacts
      - run: node scripts/verify-update-artifact.mjs artifacts/portable-update-windows-x64.json artifacts/DSH-Portable-update-windows-x64.zip
      - name: Apply and roll back component update
        shell: powershell
        run: |
          $Root = Join-Path $env:RUNNER_TEMP 'dsh-update-smoke'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          tar.exe -x -f artifacts/DSH-Portable-windows-x64-offline.zip -C $Root
          if ($LASTEXITCODE -ne 0) { throw "Windows package extraction failed with exit code $LASTEXITCODE" }
          node scripts/smoke-update-artifact.mjs (Join-Path $Root 'DSH-Portable') artifacts/portable-update-windows-x64.json artifacts/DSH-Portable-update-windows-x64.zip

  windows-portable-smoke:
    name: Windows movable ZIP
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          path: artifacts
      - name: Extract, run, move, and stop portable ZIP
        shell: powershell
        run: |
          $Root = Join-Path $env:RUNNER_TEMP 'dsh-portable-smoke'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          tar.exe -x -f artifacts/DSH-Portable-windows-x64-offline.zip -C $Root
          if ($LASTEXITCODE -ne 0) { throw "Windows package extraction failed with exit code $LASTEXITCODE" }
          node scripts/smoke-portable.mjs (Join-Path $Root 'DSH-Portable')

  windows-plugin-smoke:
    name: Windows bundled plugin management
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          path: artifacts
      - name: Add, list, update, restart, remove, and move with no system Node or pnpm
        shell: powershell
        run: |
          $Root = Join-Path $env:RUNNER_TEMP 'dsh-plugin-product-smoke'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          tar.exe -x -f artifacts/DSH-Portable-windows-x64-offline.zip -C $Root
          if ($LASTEXITCODE -ne 0) { throw "Windows package extraction failed with exit code $LASTEXITCODE" }
          ./scripts/smoke-windows-plugins.ps1 `
            -Root (Join-Path $Root 'DSH-Portable') `
            -Fixture 'tests\fixtures\dsh-portable-smoke-plugin'

  windows-desktop-host:
    name: Windows native desktop identity and lifecycle
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          path: artifacts
      - name: Verify the real native window, taskbar identity, and graceful close
        shell: powershell
        run: |
          $Root = Join-Path $env:RUNNER_TEMP 'dsh-desktop-host'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          tar.exe -x -f artifacts/DSH-Portable-windows-x64-offline.zip -C $Root
          if ($LASTEXITCODE -ne 0) { throw "Windows package extraction failed with exit code $LASTEXITCODE" }
          ./scripts/smoke-windows-desktop-host.ps1 -Root (Join-Path $Root 'DSH-Portable')
          ./scripts/smoke-windows-native-tray.ps1 -Root (Join-Path $Root 'DSH-Portable')
          node scripts/smoke-windows-tray-bridge.mjs (Join-Path $Root 'DSH-Portable')
          # WebView2 can keep the previous user-data browser process alive after
          # its host exits. Verify downloads from a separately extracted product
          # root so the debugging arguments cannot be swallowed by that process.
          $DownloadRoot = Join-Path $env:RUNNER_TEMP 'dsh-native-download-host'
          New-Item -ItemType Directory -Force -Path $DownloadRoot | Out-Null
          tar.exe -x -f artifacts/DSH-Portable-windows-x64-offline.zip -C $DownloadRoot
          if ($LASTEXITCODE -ne 0) { throw "Windows download-smoke extraction failed with exit code $LASTEXITCODE" }
          node scripts/smoke-windows-native-download.mjs (Join-Path $DownloadRoot 'DSH-Portable')

  windows-bootstrap-smoke:
    name: Windows lightweight bootstrap
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          path: artifacts
      - run: node scripts/smoke-windows-bootstrap.mjs

  windows-version-upgrade-smoke:
    name: Windows latest release upgrade
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          path: artifacts
      - name: Upgrade the latest published portable release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PriorTag = gh release view --repo "$env:GITHUB_REPOSITORY" --json tagName --jq .tagName
          if (-not $PriorTag) { throw 'Could not resolve the latest published release.' }
          $CandidateVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($PriorTag -eq "v$CandidateVersion") {
            Write-Host "Latest release $PriorTag already matches this candidate; no upgrade boundary to test."
            exit 0
          }
          $Prior = Join-Path $env:RUNNER_TEMP 'prior-release'
          New-Item -ItemType Directory -Force -Path $Prior | Out-Null
          gh release download $PriorTag --repo "$env:GITHUB_REPOSITORY" `
            --pattern 'DSH-Portable-windows-x64-offline.zip' --dir $Prior
          node scripts/smoke-windows-version-upgrade.mjs `
            (Join-Path $Prior 'DSH-Portable-windows-x64-offline.zip') artifacts

  windows-extractor-smoke:
    name: Windows self-extractor
    needs: windows-inno-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-extractor
          path: artifacts
      - shell: powershell
        run: ./scripts/smoke-windows-portable-extractor.ps1

  windows-installer-smoke:
    name: Windows installer
    needs: windows-inno-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-installer
          path: artifacts
      - shell: powershell
        run: ./scripts/smoke-windows-installer.ps1

  macos-build:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash scripts/build-macos.sh "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-build
          path: |
            artifacts/DSH-Portable-macos-${{ matrix.arch }}.zip
            artifacts/DSH-Portable-macos-${{ matrix.arch }}.zip.sha256
            artifacts/DSH-Portable-update-macos-${{ matrix.arch }}.zip
            artifacts/DSH-Portable-update-macos-${{ matrix.arch }}.zip.sha256
            artifacts/portable-update-macos-${{ matrix.arch }}.json
            artifacts/DeepSeek-Herness-macos-${{ matrix.arch }}.dmg
            artifacts/DeepSeek-Herness-macos-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
          compression-level: 0

  macos-portable-smoke:
    name: macOS portable (${{ matrix.arch }})
    needs: macos-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: macos-${{ matrix.arch }}-build
          path: artifacts
      - run: node scripts/verify-update-artifact.mjs "artifacts/portable-update-macos-${{ matrix.arch }}.json" "artifacts/DSH-Portable-update-macos-${{ matrix.arch }}.zip"
      - name: Extract, update, run, move, and stop portable ZIP
        run: |
          ROOT="$RUNNER_TEMP/dsh-portable-smoke"
          mkdir -p "$ROOT"
          ditto -x -k "artifacts/DSH-Portable-macos-${{ matrix.arch }}.zip" "$ROOT"
          node scripts/smoke-update-artifact.mjs "$ROOT/DSH-Portable" "artifacts/portable-update-macos-${{ matrix.arch }}.json" "artifacts/DSH-Portable-update-macos-${{ matrix.arch }}.zip"
          node scripts/smoke-portable.mjs "$ROOT/DSH-Portable"

  macos-desktop-host:
    name: macOS native desktop identity and lifecycle (${{ matrix.arch }})
    needs: macos-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos-${{ matrix.arch }}-build
          path: artifacts
      - name: Verify the real WKWebView app and graceful close
        run: |
          ROOT="$RUNNER_TEMP/dsh-desktop-host"
          mkdir -p "$ROOT"
          ditto -x -k "artifacts/DSH-Portable-macos-${{ matrix.arch }}.zip" "$ROOT"
          bash scripts/smoke-macos-desktop-host.sh "$ROOT/DSH-Portable"

  macos-dmg-smoke:
    name: macOS DMG (${{ matrix.arch }})
    needs: macos-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos-${{ matrix.arch }}-build
          path: artifacts
      - run: bash scripts/smoke-macos-dmg.sh "artifacts/DeepSeek-Herness-macos-${{ matrix.arch }}.dmg"

  linux-build:
    name: Build Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            launcher/linux/package-lock.json
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Install pinned Linux desktop build dependencies
        run: |
          bash scripts/install-linux-packages.sh \
            build-essential curl file fuse libayatana-appindicator3-dev libfuse2 \
            libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf \
            unzip xauth xvfb xdotool zip
      - run: bash scripts/build-linux.sh "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-build
          path: |
            artifacts/DSH-Portable-linux-${{ matrix.arch }}.tar.gz
            artifacts/DSH-Portable-linux-${{ matrix.arch }}.tar.gz.sha256
            artifacts/DeepSeek-Herness-linux-${{ matrix.arch }}.AppImage
            artifacts/DeepSeek-Herness-linux-${{ matrix.arch }}.AppImage.sha256
            artifacts/DSH-Portable-update-linux-${{ matrix.arch }}.zip
            artifacts/DSH-Portable-update-linux-${{ matrix.arch }}.zip.sha256
            artifacts/portable-update-linux-${{ matrix.arch }}.json
          if-no-files-found: error
          compression-level: 0

  linux-portable-smoke:
    name: Linux movable package and component update (${{ matrix.arch }})
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}-build
          path: artifacts
      - name: Install Linux runtime smoke dependencies
        run: bash scripts/install-linux-packages.sh libayatana-appindicator3-1 libwebkit2gtk-4.1-0 unzip xauth xvfb
      - run: node scripts/verify-update-artifact.mjs "artifacts/portable-update-linux-${{ matrix.arch }}.json" "artifacts/DSH-Portable-update-linux-${{ matrix.arch }}.zip"
      - name: Extract, update, run, move, and stop
        run: |
          ROOT="$RUNNER_TEMP/dsh-linux-portable"
          mkdir -p "$ROOT"
          tar -xzf "artifacts/DSH-Portable-linux-${{ matrix.arch }}.tar.gz" -C "$ROOT"
          node scripts/smoke-update-artifact.mjs "$ROOT/DSH-Portable" "artifacts/portable-update-linux-${{ matrix.arch }}.json" "artifacts/DSH-Portable-update-linux-${{ matrix.arch }}.zip"
          xvfb-run -a node scripts/smoke-portable.mjs "$ROOT/DSH-Portable"

  linux-plugin-smoke:
    name: Linux bundled plugin management (${{ matrix.arch }})
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}-build
          path: artifacts
      - name: Install one-click package smoke dependencies
        run: bash scripts/install-linux-packages.sh libwebkit2gtk-4.1-0 xauth xvfb
      - name: Add, list, compose, remove, and move with no system Node or pnpm
        run: |
          ROOT="$RUNNER_TEMP/dsh-linux-plugins"
          mkdir -p "$ROOT"
          tar -xzf "artifacts/DSH-Portable-linux-${{ matrix.arch }}.tar.gz" -C "$ROOT"
          bash scripts/smoke-linux-plugins.sh "$ROOT/DSH-Portable" tests/fixtures/dsh-portable-smoke-plugin
      - name: Repeat plugin lifecycle through the one-click AppImage
        run: |
          chmod +x "artifacts/DeepSeek-Herness-linux-${{ matrix.arch }}.AppImage"
          xvfb-run -a bash scripts/smoke-linux-appimage-plugins.sh \
            "artifacts/DeepSeek-Herness-linux-${{ matrix.arch }}.AppImage" \
            tests/fixtures/dsh-portable-smoke-plugin

  linux-desktop-host:
    name: Linux native desktop identity and AppImage (${{ matrix.arch }})
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}-build
          path: artifacts
      - name: Install native Linux desktop smoke dependencies
        run: |
          bash scripts/install-linux-packages.sh \
            libayatana-appindicator3-1 libwebkit2gtk-4.1-0 xauth xvfb xdotool
      - name: Verify native window, lifecycle, and self-contained AppImage payload
        run: |
          ROOT="$RUNNER_TEMP/dsh-linux-desktop"
          mkdir -p "$ROOT"
          tar -xzf "artifacts/DSH-Portable-linux-${{ matrix.arch }}.tar.gz" -C "$ROOT"
          xvfb-run -a bash scripts/smoke-linux-desktop-host.sh "$ROOT/DSH-Portable"
          chmod +x "artifacts/DeepSeek-Herness-linux-${{ matrix.arch }}.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "artifacts/DeepSeek-Herness-linux-${{ matrix.arch }}.AppImage" --diagnostic-root-json | tee "$RUNNER_TEMP/appimage-layout.json"
          grep -q '"mode":"appimage"' "$RUNNER_TEMP/appimage-layout.json"
