name: Build and smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub Actions syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate workflow semantics with actionlint
        run: |
          curl --fail --location --retry 3 --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint

  preview-packed-runtime:
    name: Locked official preview package set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Resolve the product channel and locked upstream source
        id: preview
        run: |
          node scripts/version-policy.mjs "$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          node -e "const lock=require('./upstream.preview.lock.json'); console.log('commit='+lock.dsh.reviewedCommit); console.log('version='+lock.dsh.version); console.log('packageManager='+lock.dsh.packageManager); for (const [family,count] of Object.entries(lock.dsh.packedFamilies)) console.log(family+'Count='+count)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.preview.outputs.channel == 'candidate'
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.preview.outputs.commit }}
          path: upstream
      - name: Build and pack the locked official DSH source
        if: steps.preview.outputs.channel == 'candidate'
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "${{ steps.preview.outputs.commit }}"
          npm install --global "${{ steps.preview.outputs.packageManager }}"
          pnpm --dir upstream install --frozen-lockfile
          pnpm --dir upstream run build:official
          pnpm --dir upstream run release:pack --family dsh --out dist/npm --concurrency 8
          pnpm --dir upstream run release:pack --family vendor --out dist/npm-vendor --concurrency 8
          mkdir -p upstream/dist/npm-landlock
          pnpm --dir upstream/native/landlock-run/packages/entry pack --pack-destination "$PWD/upstream/dist/npm-landlock"
          test "$(find upstream/dist/npm -maxdepth 1 -name '*.tgz' | wc -l)" -eq "${{ steps.preview.outputs.dshCount }}"
          test "$(find upstream/dist/npm-vendor -maxdepth 1 -name '*.tgz' | wc -l)" -eq "${{ steps.preview.outputs.vendorCount }}"
          test "$(find upstream/dist/npm-landlock -maxdepth 1 -name '*.tgz' | wc -l)" -eq "${{ steps.preview.outputs.landlockCount }}"
      - name: Create a stable-channel marker
        if: steps.preview.outputs.channel != 'candidate'
        run: mkdir preview-packed && printf 'stable\n' > preview-packed/STABLE
      - uses: actions/upload-artifact@v7
        with:
          name: preview-packed-runtime
          path: |
            upstream/dist/npm
            upstream/dist/npm-vendor
            upstream/dist/npm-landlock
            preview-packed/STABLE
          if-no-files-found: ignore
          compression-level: 0

  contracts:
    name: Contracts (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows-x64
          - runner: macos-15
            label: macos-arm64
          - runner: macos-15-intel
            label: macos-x64
          - runner: ubuntu-22.04
            label: linux-x64
          - runner: ubuntu-22.04-arm
            label: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app --ignore-scripts
      - run: npm test

  windows-build:
    name: Build Windows base artifacts
    needs: preview-packed-runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: preview-packed-runtime
          path: preview-packed
      - name: Stage the locked official preview runtime when required
        shell: powershell
        run: |
          $Version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $Policy = node scripts/version-policy.mjs $Version | ConvertFrom-StringData
          if ($Policy.channel -eq 'candidate') {
            node scripts/stage-preview-runtime.mjs --packed-root preview-packed/upstream/dist --output preview-app
          }
      - name: Build Windows portable base
        shell: powershell
        run: |
          $Version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $Policy = node scripts/version-policy.mjs $Version | ConvertFrom-StringData
          if ($Policy.channel -eq 'candidate') {
            ./scripts/build-windows.ps1 -PreviewAppSource preview-app
          } else {
            ./scripts/build-windows.ps1
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-build
          path: |
            artifacts/DSH-Portable-windows-x64-offline.zip
            artifacts/DSH-Portable-windows-x64-offline.zip.sha256
            artifacts/DSH-Portable-windows-x64.exe
            artifacts/DSH-Portable-windows-x64.exe.sha256
            artifacts/portable-manifest.json
            artifacts/DSH-Portable-update-windows-x64.zip
            artifacts/DSH-Portable-update-windows-x64.zip.sha256
            artifacts/portable-update-windows-x64.json
            artifacts/dsh-core-update-windows-x64.json
            artifacts/footprint-windows-x64.json
          if-no-files-found: error
          compression-level: 0

  windows-inno-build:
    name: Build Windows ${{ matrix.label }}
    needs: windows-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: portable
            label: portable self-extractor
            artifact: windows-x64-extractor
            filename: DSH-Portable-windows-x64-offline.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          path: artifacts
      - name: Install pinned Inno Setup 7 compiler
        shell: powershell
        run: |
          $Installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $CompilerRoot = Join-Path $env:RUNNER_TEMP 'is7'
          $ExpectedSha256 = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $Installer
          $ActualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $Installer).Hash.ToLowerInvariant()
          if ($ActualSha256 -ne $ExpectedSha256) { throw "Inno Setup SHA-256 mismatch: $ActualSha256" }
          $Arguments = '/SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /PORTABLE=1 /DIR="{0}"' -f $CompilerRoot
          $Process = Start-Process -FilePath $Installer -ArgumentList $Arguments -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Inno Setup installation failed with code $($Process.ExitCode)" }
          $Iscc = Join-Path $CompilerRoot 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $Iscc)) { throw "ISCC.exe is missing: $Iscc" }
          "ISCC_PATH=$Iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build ${{ matrix.label }} from the verified base archive
        shell: powershell
        run: ./scripts/build-windows-inno.ps1 -Kind '${{ matrix.kind }}' -Archive 'artifacts/DSH-Portable-windows-x64-offline.zip' -OutputDir 'artifacts' -IsccPath $env:ISCC_PATH
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            artifacts/${{ matrix.filename }}
            artifacts/${{ matrix.filename }}.sha256
          if-no-files-found: error
          compression-level: 0

  windows-update-smoke:
    name: Windows component update
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          path: artifacts
      - run: node scripts/verify-update-artifact.mjs artifacts/portable-update-windows-x64.json artifacts/DSH-Portable-update-windows-x64.zip
      - name: Apply and roll back component update
        shell: powershell
        run: |
          $Root = Join-Path $env:RUNNER_TEMP 'dsh-update-smoke'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          tar.exe -x -f artifacts/DSH-Portable-windows-x64-offline.zip -C $Root
          if ($LASTEXITCODE -ne 0) { throw "Windows package extraction failed with exit code $LASTEXITCODE" }
          node scripts/smoke-update-artifact.mjs (Join-Path $Root 'DSH-Portable') artifacts/portable-update-windows-x64.json artifacts/DSH-Portable-update-windows-x64.zip

  windows-portable-smoke:
    name: Windows movable ZIP
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          path: artifacts
      - name: Extract, run, move, and stop portable ZIP
        shell: powershell
        run: |
          $Root = Join-Path $env:RUNNER_TEMP 'dsh-portable-smoke'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          tar.exe -x -f artifacts/DSH-Portable-windows-x64-offline.zip -C $Root
          if ($LASTEXITCODE -ne 0) { throw "Windows package extraction failed with exit code $LASTEXITCODE" }
          node scripts/smoke-portable.mjs (Join-Path $Root 'DSH-Portable')
      - name: Run two isolated portable roots in parallel
        shell: powershell
        run: |
          $FirstRoot = Join-Path $env:RUNNER_TEMP 'dsh-portable-parallel-a'
          $SecondRoot = Join-Path $env:RUNNER_TEMP 'dsh-portable-parallel-b'
          New-Item -ItemType Directory -Force -Path $FirstRoot, $SecondRoot | Out-Null
          tar.exe -x -f artifacts/DSH-Portable-windows-x64-offline.zip -C $FirstRoot
          if ($LASTEXITCODE -ne 0) { throw "First parallel package extraction failed with exit code $LASTEXITCODE" }
          tar.exe -x -f artifacts/DSH-Portable-windows-x64-offline.zip -C $SecondRoot
          if ($LASTEXITCODE -ne 0) { throw "Second parallel package extraction failed with exit code $LASTEXITCODE" }
          node scripts/smoke-portable-parallel-roots.mjs `
            (Join-Path $FirstRoot 'DSH-Portable') `
            (Join-Path $SecondRoot 'DSH-Portable')

  windows-plugin-smoke:
    name: Windows bundled plugin management
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          path: artifacts
      - name: Add, list, update, restart, remove, and move with no system Node or pnpm
        shell: powershell
        run: |
          $Root = Join-Path $env:RUNNER_TEMP 'dsh-plugin-product-smoke'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          tar.exe -x -f artifacts/DSH-Portable-windows-x64-offline.zip -C $Root
          if ($LASTEXITCODE -ne 0) { throw "Windows package extraction failed with exit code $LASTEXITCODE" }
          & (Join-Path $Root 'DSH-Portable\runtime\node\node.exe') `
            scripts/smoke-portable-extensions.mjs `
            (Join-Path $Root 'DSH-Portable') `
            'tests\fixtures\dsh-portable-smoke-plugin'
          if ($LASTEXITCODE -ne 0) { throw "Windows stable extension-surface smoke failed with exit code $LASTEXITCODE" }
          & (Join-Path $Root 'DSH-Portable\runtime\node\node.exe') `
            scripts/smoke-plugin-marketplace.mjs `
            (Join-Path $Root 'DSH-Portable')
          if ($LASTEXITCODE -ne 0) { throw "Windows visual plugin market smoke failed with exit code $LASTEXITCODE" }
          ./scripts/smoke-windows-plugins.ps1 `
            -Root (Join-Path $Root 'DSH-Portable') `
            -Fixture 'tests\fixtures\dsh-portable-smoke-plugin'

  windows-desktop-host:
    name: Windows native desktop identity and lifecycle (${{ matrix.label }})
    needs: windows-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            label: windows-2022
            # Hosted runners include variable first-execution Defender scanning.
            # Keep a functional ceiling here; config/performance-budgets.json
            # remains the stricter controlled-machine performance contract.
            firstColdStartSeconds: 75
          - runner: windows-2025
            label: windows-2025
            firstColdStartSeconds: 75
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          path: artifacts
      - name: Verify the real native window, taskbar identity, and graceful close
        shell: powershell
        run: |
          $Root = Join-Path $env:RUNNER_TEMP 'dsh-desktop-host'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          tar.exe -x -f artifacts/DSH-Portable-windows-x64-offline.zip -C $Root
          if ($LASTEXITCODE -ne 0) { throw "Windows package extraction failed with exit code $LASTEXITCODE" }
          $StartupEvidence = Join-Path $env:RUNNER_TEMP "dsh-startup-transition-${{ matrix.label }}"
          node scripts/audit-windows-startup-transition.mjs (Join-Path $Root 'DSH-Portable') $StartupEvidence ${{ matrix.firstColdStartSeconds }}
          if ($LASTEXITCODE -ne 0) { throw "Windows startup transition audit failed with exit code $LASTEXITCODE" }
          ./scripts/smoke-windows-detached-updater.ps1 -Root (Join-Path $Root 'DSH-Portable')
          ./scripts/smoke-windows-desktop-move.ps1 `
            -Root (Join-Path $Root 'DSH-Portable') `
            -FirstColdStartLimit ${{ matrix.firstColdStartSeconds }}
          ./scripts/smoke-windows-dom-ready.ps1 -Root (Join-Path $Root 'DSH-Portable')
          ./scripts/smoke-windows-native-tray.ps1 -Root (Join-Path $Root 'DSH-Portable')
          node scripts/smoke-windows-native-restart.mjs (Join-Path $Root 'DSH-Portable')
          if ($LASTEXITCODE -ne 0) { throw "Windows native restart smoke failed with exit code $LASTEXITCODE" }
          node scripts/smoke-windows-subprocess-hide.mjs (Join-Path $Root 'DSH-Portable')
          if ($LASTEXITCODE -ne 0) { throw "Windows subprocess hiding smoke failed with exit code $LASTEXITCODE" }
          node scripts/smoke-windows-tray-bridge.mjs (Join-Path $Root 'DSH-Portable')
          if ($LASTEXITCODE -ne 0) { throw "Windows tray bridge smoke failed with exit code $LASTEXITCODE" }
          # WebView2 can keep the previous user-data browser process alive after
          # its host exits. Verify downloads from a separately extracted product
          # root so the debugging arguments cannot be swallowed by that process.
          $DownloadRoot = Join-Path $env:RUNNER_TEMP 'dsh-native-download-host'
          New-Item -ItemType Directory -Force -Path $DownloadRoot | Out-Null
          tar.exe -x -f artifacts/DSH-Portable-windows-x64-offline.zip -C $DownloadRoot
          if ($LASTEXITCODE -ne 0) { throw "Windows download-smoke extraction failed with exit code $LASTEXITCODE" }
          node scripts/smoke-windows-native-download.mjs (Join-Path $DownloadRoot 'DSH-Portable')
          if ($LASTEXITCODE -ne 0) { throw "Windows native download smoke failed with exit code $LASTEXITCODE" }
          $WorkspacePickerRoot = Join-Path $env:RUNNER_TEMP 'dsh-native-workspace-picker-host'
          New-Item -ItemType Directory -Force -Path $WorkspacePickerRoot | Out-Null
          tar.exe -x -f artifacts/DSH-Portable-windows-x64-offline.zip -C $WorkspacePickerRoot
          if ($LASTEXITCODE -ne 0) { throw "Windows workspace-picker smoke extraction failed with exit code $LASTEXITCODE" }
          node scripts/smoke-windows-native-workspace-picker.mjs (Join-Path $WorkspacePickerRoot 'DSH-Portable')
          if ($LASTEXITCODE -ne 0) { throw "Windows native workspace picker smoke failed with exit code $LASTEXITCODE" }
          $MigrationRoot = Join-Path $env:RUNNER_TEMP 'dsh-native-migration-host'
          $MigrationEvidence = Join-Path $env:RUNNER_TEMP "dsh-native-migration-evidence-${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path $MigrationRoot, $MigrationEvidence | Out-Null
          tar.exe -x -f artifacts/DSH-Portable-windows-x64-offline.zip -C $MigrationRoot
          if ($LASTEXITCODE -ne 0) { throw "Windows migration-smoke extraction failed with exit code $LASTEXITCODE" }
          $MigrationProduct = Join-Path $MigrationRoot 'DSH-Portable'
          $MigrationNode = Join-Path $MigrationProduct 'runtime\node\node.exe'
          & $MigrationNode scripts/smoke-windows-data-export.mjs $MigrationProduct $MigrationEvidence
          if ($LASTEXITCODE -ne 0) { throw "Windows native data migration smoke failed with exit code $LASTEXITCODE" }
      - name: Upload native migration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-migration-${{ matrix.label }}
          path: ${{ runner.temp }}/dsh-native-migration-evidence-${{ matrix.label }}
          if-no-files-found: warn
      - name: Upload startup transition evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-startup-transition-${{ matrix.label }}
          path: ${{ runner.temp }}/dsh-startup-transition-${{ matrix.label }}
          if-no-files-found: warn

  windows-bootstrap-smoke:
    name: Windows lightweight bootstrap
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          path: artifacts
      - run: node scripts/smoke-windows-bootstrap.mjs

  windows-version-upgrade-smoke:
    name: Windows running published release upgrade
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          path: artifacts
      - name: Upgrade the immediate prior same-channel release through its declared delivery path
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $CandidateVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $Policy = node scripts/version-policy.mjs $CandidateVersion | ConvertFrom-StringData
          $Target = Get-Content artifacts/portable-update-windows-x64.json -Raw | ConvertFrom-Json
          $Releases = gh release list --repo "$env:GITHUB_REPOSITORY" --exclude-drafts `
            --limit 100 --json tagName,isPrerelease,publishedAt | ConvertFrom-Json
          $Eligible = @()
          if ($Policy.channel -eq 'candidate') {
            $CandidateMatch = [regex]::Match($CandidateVersion, '^(?<base>\d+\.\d+\.\d+)-rc\.(?<rc>\d+)$')
            $Eligible = $Releases | Where-Object {
              $ReleaseMatch = [regex]::Match($_.tagName, '^v(?<base>\d+\.\d+\.\d+)-rc\.(?<rc>\d+)$')
              $_.isPrerelease -and $ReleaseMatch.Success -and `
                $ReleaseMatch.Groups['base'].Value -eq $CandidateMatch.Groups['base'].Value -and `
                [int]$ReleaseMatch.Groups['rc'].Value -lt [int]$CandidateMatch.Groups['rc'].Value
            } | Sort-Object publishedAt -Descending
          }
          if (-not $Eligible) {
            $Eligible = $Releases | Where-Object {
              -not $_.isPrerelease -and $_.tagName -match '^v\d+\.\d+\.\d+$' -and $_.tagName -ne "v$CandidateVersion"
            } | Sort-Object publishedAt -Descending
          }
          $Prior = $Eligible | Select-Object -First 1
          $PriorTag = $Prior.tagName
          if (-not $PriorTag) {
            Write-Host 'No immediate prior release exists for this channel; nothing to test.'
            exit 0
          }
          $TagDir = Join-Path $env:RUNNER_TEMP ("prior-release-" + $PriorTag.TrimStart('v'))
          New-Item -ItemType Directory -Force -Path $TagDir | Out-Null
          gh release download $PriorTag --repo "$env:GITHUB_REPOSITORY" `
            --pattern 'DSH-Portable-windows-x64-offline.zip' --dir $TagDir
          $PriorZip = Join-Path $TagDir 'DSH-Portable-windows-x64-offline.zip'
          $ComponentsJson = tar.exe -xOf $PriorZip DSH-Portable/licenses/COMPONENTS.json
          if ($LASTEXITCODE -ne 0 -or -not $ComponentsJson) {
            throw "Could not read COMPONENTS.json from $PriorTag."
          }
          $Components = $ComponentsJson | ConvertFrom-Json
          Write-Host "Testing declared upgrade path from $PriorTag to $CandidateVersion."
          $UpgradeArguments = @(
            'scripts/smoke-windows-version-upgrade.mjs',
            $PriorZip,
            'artifacts',
            '--running-host',
            '--simulate-webview-busy'
          )
          if ([string]$Components.releaseChannel -ne [string]$Target.releaseChannel) {
            if ([string]$Target.releaseChannel -ne 'candidate') {
              throw "Refusing an implicit release-channel migration to $($Target.releaseChannel)."
            }
            $UpgradeArguments += '--allow-channel-migration'
          }
          node @UpgradeArguments

  windows-extractor-smoke:
    name: Windows self-extractor
    needs: windows-inno-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-extractor
          path: artifacts
      - shell: powershell
        run: ./scripts/smoke-windows-portable-extractor.ps1

  macos-build:
    name: Build macOS (${{ matrix.arch }})
    needs: preview-packed-runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: preview-packed-runtime
          path: preview-packed
      - name: Build the product from the matching stable or preview runtime
        run: |
          CHANNEL="$(node scripts/version-policy.mjs "$(node -p "require('./package.json').version")" | awk -F= '$1 == "channel" { print $2 }')"
          if [ "$CHANNEL" = candidate ]; then
            node scripts/stage-preview-runtime.mjs --packed-root preview-packed/upstream/dist --output preview-app
            PREVIEW_APP_SOURCE="$PWD/preview-app" bash scripts/build-macos.sh "${{ matrix.arch }}"
          else
            bash scripts/build-macos.sh "${{ matrix.arch }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-build
          path: |
            artifacts/DSH-Portable-macos-${{ matrix.arch }}.zip
            artifacts/DSH-Portable-macos-${{ matrix.arch }}.zip.sha256
            artifacts/DSH-Portable-update-macos-${{ matrix.arch }}.zip
            artifacts/DSH-Portable-update-macos-${{ matrix.arch }}.zip.sha256
            artifacts/portable-update-macos-${{ matrix.arch }}.json
            artifacts/dsh-core-update-macos-${{ matrix.arch }}.json
            artifacts/footprint-macos-${{ matrix.arch }}.json
          if-no-files-found: error
          compression-level: 0

  macos-portable-smoke:
    name: macOS portable (${{ matrix.arch }})
    needs: macos-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: macos-${{ matrix.arch }}-build
          path: artifacts
      - run: node scripts/verify-update-artifact.mjs "artifacts/portable-update-macos-${{ matrix.arch }}.json" "artifacts/DSH-Portable-update-macos-${{ matrix.arch }}.zip"
      - name: Extract, update, run, move, and stop portable ZIP
        run: |
          ROOT="$RUNNER_TEMP/dsh-portable-smoke"
          mkdir -p "$ROOT"
          ditto -x -k "artifacts/DSH-Portable-macos-${{ matrix.arch }}.zip" "$ROOT"
          node scripts/smoke-update-artifact.mjs "$ROOT/DSH-Portable" "artifacts/portable-update-macos-${{ matrix.arch }}.json" "artifacts/DSH-Portable-update-macos-${{ matrix.arch }}.zip"
          node scripts/smoke-portable.mjs "$ROOT/DSH-Portable"

  macos-desktop-host:
    name: macOS native desktop identity and lifecycle (${{ matrix.arch }})
    needs: macos-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos-${{ matrix.arch }}-build
          path: artifacts
      - name: Verify the real WKWebView app and graceful close
        run: |
          ROOT="$RUNNER_TEMP/dsh-desktop-host"
          mkdir -p "$ROOT"
          ditto -x -k "artifacts/DSH-Portable-macos-${{ matrix.arch }}.zip" "$ROOT"
          bash scripts/smoke-macos-desktop-host.sh "$ROOT/DSH-Portable"

  macos-plugin-smoke:
    name: macOS plugin portability (${{ matrix.arch }})
    needs: macos-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos-${{ matrix.arch }}-build
          path: artifacts
      - name: Install, compose, record, and remove an independent extension from the finished product
        run: |
          ROOT="$RUNNER_TEMP/dsh-macos-extensions"
          mkdir -p "$ROOT"
          ditto -x -k "artifacts/DSH-Portable-macos-${{ matrix.arch }}.zip" "$ROOT"
          "$ROOT/DSH-Portable/runtime/node/bin/node" \
            scripts/smoke-portable-extensions.mjs \
            "$ROOT/DSH-Portable" \
            tests/fixtures/dsh-portable-smoke-plugin
          "$ROOT/DSH-Portable/runtime/node/bin/node" \
            scripts/smoke-plugin-marketplace.mjs \
            "$ROOT/DSH-Portable"

  linux-build:
    name: Build Linux (${{ matrix.arch }})
    needs: preview-packed-runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            launcher/linux/package-lock.json
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Install pinned Linux desktop build dependencies
        run: |
          bash scripts/install-linux-packages.sh \
            build-essential curl file fuse libayatana-appindicator3-dev libfuse2 \
            libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf \
            unzip xauth xvfb xdotool zip
      - uses: actions/download-artifact@v8
        with:
          name: preview-packed-runtime
          path: preview-packed
      - name: Build the product from the matching stable or preview runtime
        run: |
          CHANNEL="$(node scripts/version-policy.mjs "$(node -p "require('./package.json').version")" | awk -F= '$1 == "channel" { print $2 }')"
          if [ "$CHANNEL" = candidate ]; then
            node scripts/stage-preview-runtime.mjs --packed-root preview-packed/upstream/dist --output preview-app
            PREVIEW_APP_SOURCE="$PWD/preview-app" bash scripts/build-linux.sh "${{ matrix.arch }}"
          else
            bash scripts/build-linux.sh "${{ matrix.arch }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-build
          path: |
            artifacts/DSH-Portable-linux-${{ matrix.arch }}.tar.gz
            artifacts/DSH-Portable-linux-${{ matrix.arch }}.tar.gz.sha256
            artifacts/DeepSeek-Herness-linux-${{ matrix.arch }}.AppImage
            artifacts/DeepSeek-Herness-linux-${{ matrix.arch }}.AppImage.sha256
            artifacts/DSH-Portable-update-linux-${{ matrix.arch }}.zip
            artifacts/DSH-Portable-update-linux-${{ matrix.arch }}.zip.sha256
            artifacts/portable-update-linux-${{ matrix.arch }}.json
            artifacts/dsh-core-update-linux-${{ matrix.arch }}.json
            artifacts/footprint-linux-${{ matrix.arch }}.json
          if-no-files-found: error
          compression-level: 0

  linux-portable-smoke:
    name: Linux movable package and component update (${{ matrix.arch }})
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}-build
          path: artifacts
      - name: Install Linux runtime smoke dependencies
        run: bash scripts/install-linux-packages.sh libayatana-appindicator3-1 libwebkit2gtk-4.1-0 unzip xauth xvfb
      - run: node scripts/verify-update-artifact.mjs "artifacts/portable-update-linux-${{ matrix.arch }}.json" "artifacts/DSH-Portable-update-linux-${{ matrix.arch }}.zip"
      - name: Extract, update, run, move, and stop
        run: |
          ROOT="$RUNNER_TEMP/dsh-linux-portable"
          mkdir -p "$ROOT"
          tar -xzf "artifacts/DSH-Portable-linux-${{ matrix.arch }}.tar.gz" -C "$ROOT"
          node scripts/smoke-update-artifact.mjs "$ROOT/DSH-Portable" "artifacts/portable-update-linux-${{ matrix.arch }}.json" "artifacts/DSH-Portable-update-linux-${{ matrix.arch }}.zip"
          xvfb-run -a node scripts/smoke-portable.mjs "$ROOT/DSH-Portable"

  linux-plugin-smoke:
    name: Linux bundled plugin management (${{ matrix.arch }})
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}-build
          path: artifacts
      - name: Install one-click package smoke dependencies
        run: bash scripts/install-linux-packages.sh libwebkit2gtk-4.1-0 xauth xvfb
      - name: Add, list, compose, remove, and move with no system Node or pnpm
        run: |
          ROOT="$RUNNER_TEMP/dsh-linux-plugins"
          mkdir -p "$ROOT"
          tar -xzf "artifacts/DSH-Portable-linux-${{ matrix.arch }}.tar.gz" -C "$ROOT"
          "$ROOT/DSH-Portable/runtime/node/bin/node" \
            scripts/smoke-portable-extensions.mjs \
            "$ROOT/DSH-Portable" \
            tests/fixtures/dsh-portable-smoke-plugin
          "$ROOT/DSH-Portable/runtime/node/bin/node" \
            scripts/smoke-plugin-marketplace.mjs \
            "$ROOT/DSH-Portable"
          bash scripts/smoke-linux-plugins.sh "$ROOT/DSH-Portable" tests/fixtures/dsh-portable-smoke-plugin
      - name: Repeat plugin lifecycle through the one-click AppImage
        run: |
          chmod +x "artifacts/DeepSeek-Herness-linux-${{ matrix.arch }}.AppImage"
          xvfb-run -a bash scripts/smoke-linux-appimage-plugins.sh \
            "artifacts/DeepSeek-Herness-linux-${{ matrix.arch }}.AppImage" \
            tests/fixtures/dsh-portable-smoke-plugin

  linux-desktop-host:
    name: Linux native desktop identity and AppImage (${{ matrix.arch }})
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}-build
          path: artifacts
      - name: Install native Linux desktop smoke dependencies
        run: |
          bash scripts/install-linux-packages.sh \
            libayatana-appindicator3-1 libwebkit2gtk-4.1-0 xauth xvfb xdotool
      - name: Verify native window, lifecycle, and self-contained AppImage payload
        run: |
          ROOT="$RUNNER_TEMP/dsh-linux-desktop"
          mkdir -p "$ROOT"
          tar -xzf "artifacts/DSH-Portable-linux-${{ matrix.arch }}.tar.gz" -C "$ROOT"
          xvfb-run -a bash scripts/smoke-linux-desktop-host.sh "$ROOT/DSH-Portable"
          chmod +x "artifacts/DeepSeek-Herness-linux-${{ matrix.arch }}.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "artifacts/DeepSeek-Herness-linux-${{ matrix.arch }}.AppImage" --diagnostic-root-json | tee "$RUNNER_TEMP/appimage-layout.json"
          grep -q '"mode":"appimage"' "$RUNNER_TEMP/appimage-layout.json"

  product-qualification:
    name: Product qualification
    if: ${{ always() }}
    needs:
      - workflow-lint
      - contracts
      - windows-inno-build
      - windows-update-smoke
      - windows-portable-smoke
      - windows-plugin-smoke
      - windows-desktop-host
      - windows-bootstrap-smoke
      - windows-version-upgrade-smoke
      - windows-extractor-smoke
      - macos-portable-smoke
      - macos-desktop-host
      - macos-plugin-smoke
      - linux-portable-smoke
      - linux-plugin-smoke
      - linux-desktop-host
    runs-on: ubuntu-latest
    steps:
      - name: Require every product gate to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e "const needs=JSON.parse(process.env.NEEDS); if (!Object.values(needs).every(({ result }) => result === 'success')) { console.error(needs); process.exit(1) }"
