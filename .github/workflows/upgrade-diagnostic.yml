name: Temporary Windows upgrade diagnostics
on:
  push:
    branches: [fix/0.6.1-performance]
    paths: [.github/workflows/upgrade-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-build
          run-id: 34081779320
          github-token: ${{ github.token }}
          path: artifacts
      - name: Reproduce against the unchanged Windows artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.6.0 --repo "$env:GITHUB_REPOSITORY" --pattern DSH-Portable-windows-x64-offline.zip --dir prior
          if ($LASTEXITCODE -ne 0) { throw 'Prior release download failed.' }
          node scripts/smoke-windows-version-upgrade.mjs prior/DSH-Portable-windows-x64-offline.zip artifacts --running-host --simulate-webview-busy
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade diagnostics failed.' }
