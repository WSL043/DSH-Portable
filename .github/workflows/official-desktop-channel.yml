name: Official desktop qualified update channel
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-desktop-channel.yml'
      - '.github/actions/official-payload-stage/**'
      - 'experiments/official-payload/**'
      - '!experiments/official-payload/**.md'
  workflow_dispatch:
    inputs:
      force_version:
        description: Re-run qualification only when this version is still the official feed candidate
        required: false
        default: ''
        type: string
      publish_channel:
        description: Explicitly publish the qualified channel or report a failed qualification to an issue
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: official-desktop-qualified-channel
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      no_op: ${{ steps.identity.outputs.no_op }}
      version: ${{ steps.identity.outputs.version }}
      channel: ${{ steps.identity.outputs.channel }}
      identity: ${{ steps.identity.outputs.identity }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - name: Resolve the official desktop candidate and current channel index
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_VERSION: ${{ inputs.force_version }}
          PUBLISH_CHANNEL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_channel == true) }}
        run: |
          set -euo pipefail
          mkdir -p build/orch-080/T28/input
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          import { CHANNEL_BASE_URL, CHANNEL_INDEX_URL } from './experiments/official-payload/channel/constants.mjs';
          import { needsChannelPublication } from './experiments/official-payload/channel/build-channel.mjs';
          import { fetchOfficialDesktopCandidate, parseDesktopFeed } from './experiments/official-payload/feed.mjs';
          const candidatePath = 'build/orch-080/T28/input/candidate.json';
          let nightlyError;
          let candidate = await fetchOfficialDesktopCandidate().catch(error => {
            nightlyError = error;
            return null;
          });
          let channel = 'nightly';
          const requested = process.env.FORCE_VERSION ?? '';
          const publicationRequested = process.env.PUBLISH_CHANNEL === 'true';
          if (!candidate && (requested || !publicationRequested)) throw nightlyError;
          if (requested && candidate.version !== requested) throw new Error(`force_version ${requested} is not the current official feed candidate ${candidate.version}`);
          const response = await fetch(CHANNEL_INDEX_URL, { redirect: 'follow', signal: AbortSignal.timeout(15000) });
          let index;
          if (response.status === 404) index = { schemaVersion: 1, versions: [] };
          else {
            if (!response.ok) throw new Error(`Channel index request failed: ${response.status}`);
            const text = await response.text();
            if (text.length > 1_048_576) throw new Error('Channel index is too large');
            index = JSON.parse(text);
          }
          async function readFeed(name) {
            const response = await fetch(`${CHANNEL_BASE_URL}${name}.yml`, { redirect: 'follow', signal: AbortSignal.timeout(15000) });
            if (response.status === 404) return null;
            if (!response.ok) throw new Error(`Channel ${name} feed request failed: ${response.status}`);
            if (!index.versions?.length) throw new Error('Existing channel feed has no index; refusing to discard channel history');
            return parseDesktopFeed(await response.text());
          }
          let feed = publicationRequested ? await readFeed(channel) : null;
          if (publicationRequested && !requested && (!candidate || !needsChannelPublication(index, candidate, feed))) {
            const stable = await fetchOfficialDesktopCandidate('stable').catch(error => {
              console.warn(`::warning::Official stable feed unavailable: ${error.message}`);
              return null;
            });
            if (stable) {
              const stableFeed = await readFeed('stable');
              if (needsChannelPublication(index, stable, stableFeed, 'stable')) {
                channel = 'stable';
                candidate = stable;
                feed = stableFeed;
              }
            }
          }
          if (!candidate) throw nightlyError;
          const candidateBytes = JSON.stringify(candidate, null, 2) + '\n';
          const identity = createHash('sha256').update(candidateBytes).digest('hex');
          const needsPublication = needsChannelPublication(index, candidate, feed, channel);
          const publish = publicationRequested && needsPublication;
          const noOp = publicationRequested && !needsPublication && !requested;
          await writeFile(candidatePath, candidateBytes);
          await writeFile('build/orch-080/T28/input/index.json', JSON.stringify(index, null, 2) + '\n');
          await writeFile(process.env.GITHUB_OUTPUT, `no_op=${noOp}\npublish=${publish}\nchannel=${channel}\nversion=${candidate.version}\nidentity=${identity}\n`, { flag: 'a' });
          console.log(JSON.stringify({ version: candidate.version, channel, noOp, publish, indexedVersions: index.versions.length, indexUrl: CHANNEL_INDEX_URL }));
          NODE
      - uses: actions/upload-artifact@v7
        if: steps.identity.outputs.no_op == 'false'
        with:
          name: official-desktop-channel-input
          path: build/orch-080/T28/input/
          retention-days: 2

  gates:
    needs: resolve
    if: needs.resolve.outputs.no_op == 'false'
    runs-on: windows-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - id: qualification-cache
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: build/official-desktop-qualification
          key: desktop-qualification-${{ needs.resolve.outputs.identity }}-${{ hashFiles('experiments/official-payload/**', '.github/actions/official-payload-stage/**', '.github/workflows/official-desktop-channel.yml', '!experiments/official-payload/**.md') }}
      - name: Show the recorded result for an unchanged candidate
        if: steps.qualification-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: Get-Content -LiteralPath 'build/official-desktop-qualification/result.md' | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/download-artifact@v8
        if: steps.qualification-cache.outputs.cache-hit != 'true'
        with:
          name: official-desktop-channel-input
          path: build/orch-080/T28/input
      - name: Normalize the checked-in baseline and the resolved candidate
        if: steps.qualification-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = 'experiments/official-payload/e2e/report.mjs'
          node $helper candidate 'experiments/official-payload/candidate.json' 'build/orch-080/T28/input/old-candidate.json'
          if ($LASTEXITCODE -ne 0) { throw 'Could not normalize the checked-in 0.1.7-rc.2 candidate' }
          node $helper candidate 'build/orch-080/T28/input/candidate.json' 'build/orch-080/T28/input/new-candidate.json'
          if ($LASTEXITCODE -ne 0) { throw 'Could not normalize the resolved official candidate' }
          $old = Get-Content -LiteralPath 'build/orch-080/T28/input/old-candidate.json' -Raw | ConvertFrom-Json
          $new = Get-Content -LiteralPath 'build/orch-080/T28/input/new-candidate.json' -Raw | ConvertFrom-Json
          if ($old.version -cne '0.1.7-rc.2' -or $new.version -ceq $old.version) { throw 'Qualification requires the checked-in 0.1.7-rc.2 baseline and a distinct official candidate' }
      - id: stage-old
        name: Download and validate the baseline installer
        if: steps.qualification-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/official-payload-stage
        with:
          candidate: build/orch-080/T28/input/old-candidate.json
          installer: ${{ runner.temp }}/official-desktop-old.exe
      - id: stage-new
        name: Download, validate, and unpack the candidate installer
        if: steps.qualification-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/official-payload-stage
        with:
          candidate: build/orch-080/T28/input/new-candidate.json
          installer: ${{ runner.temp }}/official-desktop-new.exe
          expanded: build/orch-080/T28/official-new
      - name: Run phase-1 official update contract probe
        if: steps.qualification-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          UPDATE_CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./experiments/official-payload/contract/run-contract-probe.ps1 -AppDir 'build/orch-080/T28/official-new' -WorkRoot 'build/orch-080/T28/contract/work' -Locale en -UpdateChannel $env:UPDATE_CHANNEL
          if ($LASTEXITCODE -ne 0) { throw 'Official update contract probe exited non-zero' }
          $report = Get-Content -LiteralPath 'build/orch-080/T28/contract/contract-report.json' -Raw | ConvertFrom-Json
          if (-not $report.overallPassed) { throw 'Phase-1 contract report overallPassed was not true' }
      - name: Run the phase-2 real old-to-new portable acceptance
        if: steps.qualification-cache.outputs.cache-hit != 'true'
        shell: powershell
        env:
          INSTALLER_OLD: ${{ steps.stage-old.outputs.installer }}
          INSTALLER_NEW: ${{ steps.stage-new.outputs.installer }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw ('Runner 7-Zip not found: ' + $sevenZip) }
          ./experiments/official-payload/e2e/run-pure-e2e.ps1 `
            -InstallerOld $env:INSTALLER_OLD `
            -CandidateOld 'build/orch-080/T28/input/old-candidate.json' `
            -InstallerNew $env:INSTALLER_NEW `
            -CandidateNew 'build/orch-080/T28/input/new-candidate.json' `
            -SevenZip $sevenZip `
            -WorkRoot 'build/orch-080/T27/work' `
            -Locale en
          if ($LASTEXITCODE -ne 0) { throw 'Pure portable end-to-end acceptance exited non-zero' }
      - name: Copy phase-2 evidence into this task evidence directory
        if: always() && steps.qualification-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'build/orch-080/T27/pure-e2e-report.json') {
            New-Item -ItemType Directory -Path 'build/orch-080/T28/e2e-evidence' -Force | Out-Null
            # Evidence only: the work directory holds two full official payloads and must not be uploaded.
            Get-ChildItem -LiteralPath 'build/orch-080/T27' -Force | Where-Object { $_.Name -ne 'work' } | Copy-Item -Destination 'build/orch-080/T28/e2e-evidence' -Recurse -Force
          }
      - uses: actions/upload-artifact@v7
        if: always() && steps.qualification-cache.outputs.cache-hit != 'true'
        with:
          name: official-desktop-channel-gates
          path: |
            build/orch-080/T28/contract/
            build/orch-080/T28/e2e-evidence/
            build/orch-080/T28/input/
          if-no-files-found: warn
          retention-days: 14
      - name: Require both runtime reports and record the verified candidate
        if: steps.qualification-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Get-Content -LiteralPath 'build/orch-080/T28/input/candidate.json' -Raw | ConvertFrom-Json
          $contract = Get-Content -LiteralPath 'build/orch-080/T28/contract/contract-report.json' -Raw | ConvertFrom-Json
          $e2e = Get-Content -LiteralPath 'build/orch-080/T28/e2e-evidence/pure-e2e-report.json' -Raw | ConvertFrom-Json
          if ($contract.overallPassed -ne $true -or $e2e.overallPassed -ne $true -or $e2e.newVersion -cne $candidate.version) {
            throw 'Both runtime reports must pass for the resolved official candidate'
          }
          $receiptPath = "build/orch-080/T27/work/portable/launcher/receipts/$($candidate.version).json"
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          if ($receipt.version -cne $candidate.version -or $receipt.installerSha512 -cne $candidate.sha512 -or $receipt.installerSize -ne $candidate.size) {
            throw 'The installed payload receipt does not match the resolved candidate'
          }
          $summary = @(
            "Official Windows Desktop $($candidate.version) passed signature, SHA-512, update and recovery checks.",
            "Evidence: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          )
          New-Item -ItemType Directory -Path 'build/official-desktop-qualification' -Force | Out-Null
          $summary | Set-Content -LiteralPath 'build/official-desktop-qualification/result.md'
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  publish:
    needs: [resolve, gates]
    if: needs.resolve.outputs.publish == 'true' && needs.gates.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v8
        with:
          name: official-desktop-channel-input
          path: build/orch-080/T28/input
      - name: Build and publish qualified assets, then verify public downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_TAG: update-channel-desktop
          UPDATE_CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:CHANNEL_TAG
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json isPrerelease *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $assetName = "deepseek-harness-$($env:VERSION)-win-x64.exe"
          $assets = @()
          if ($releaseExists) {
            $assets = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | select(.state == "uploaded") | .name'
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing channel assets' }
          }
          $launcher = Join-Path $env:RUNNER_TEMP 'DeepSeek Harness Portable.exe'
          if ($assets -contains $assetName) {
            # Resume partial publication with the immutable asset from the previous attempt.
            $launcher = Join-Path $env:RUNNER_TEMP $assetName
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $assetName --dir $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the existing updater' }
            node scripts/upload-release-assets.mjs $tag $launcher --verify-only
            if ($LASTEXITCODE -ne 0) { throw 'Existing updater failed digest verification' }
          } else {
            ./experiments/official-payload/build-launcher.ps1 -Output $launcher
            if ($LASTEXITCODE -ne 0) { throw 'Launcher csc build failed' }
          }
          node experiments/official-payload/channel/build-channel.mjs `
            --candidate 'build/orch-080/T28/input/candidate.json' `
            --index 'build/orch-080/T28/input/index.json' `
            --channel $env:UPDATE_CHANNEL `
            --launcher $launcher `
            --output 'build/orch-080/T28/channel-output'
          if ($LASTEXITCODE -ne 0) { throw 'Qualified channel generation failed' }
          $output = 'build/orch-080/T28/channel-output'
          $exeFiles = @(Get-ChildItem -LiteralPath $output -Filter 'deepseek-harness-*-win-x64.exe' -File | ForEach-Object { $_.FullName })
          if ($exeFiles.Count -ne 1 -or [IO.Path]::GetFileName($exeFiles[0]) -cne $assetName) { throw 'Channel builder must emit only the qualified candidate launcher' }
          $exeArgs = @('scripts/upload-release-assets.mjs', $tag) + $exeFiles
          if (-not $releaseExists) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Qualified official desktop update channel' --notes 'Automatically updated only after official desktop qualification.' --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the update-channel Release' }
          }
          node @exeArgs
          if ($LASTEXITCODE -ne 0) { throw 'Immutable launcher asset upload failed' }
          $feedName = "$($env:UPDATE_CHANNEL).yml"
          node scripts/upload-release-assets.mjs $tag "$output/index.json" "$output/$feedName" --mutable
          if ($LASTEXITCODE -ne 0) { throw 'Mutable channel metadata upload failed' }
          $readback = Join-Path $env:RUNNER_TEMP 'channel-readback'
          New-Item -ItemType Directory -Path $readback -Force | Out-Null
          $urls = node experiments/official-payload/channel/constants.mjs | ConvertFrom-Json
          foreach ($name in @($assetName, 'index.json', $feedName)) {
            Invoke-WebRequest -Uri ($urls.channelBaseUrl + $name) -OutFile (Join-Path $readback $name) -TimeoutSec 20 -MaximumRetryCount 3 -RetryIntervalSec 3
            $expected = (Get-FileHash -LiteralPath (Join-Path $output $name) -Algorithm SHA256).Hash
            $actual = (Get-FileHash -LiteralPath (Join-Path $readback $name) -Algorithm SHA256).Hash
            if ($expected -cne $actual) { throw "Channel readback differs from generated $name" }
          }

  report-failure:
    needs: [resolve, gates]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish_channel == true && needs.resolve.outputs.no_op == 'false' && needs.gates.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v8
        with:
          name: official-desktop-channel-gates
          path: build/orch-080/T28/failure-evidence
      - name: Create one version-scoped issue or append its latest failure report
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          TITLE="Official desktop ${VERSION} did not qualify"
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const paths = ['build/orch-080/T28/failure-evidence/contract/contract-report.json','build/orch-080/T28/failure-evidence/e2e-evidence/pure-e2e-report.json'];
          const failures=[];
          for (const path of paths) {
            try {
              const report=JSON.parse(await readFile(path,'utf8'));
              for (const item of (report.results ?? [])) if (item.passed === false) failures.push(`${path}: ${item.id ?? 'assertion'} — ${JSON.stringify(item.evidence ?? item.detail ?? '')}`);
              if (report.overallPassed !== true && !report.results?.some(item => item.passed === false)) failures.push(`${path}: overallPassed was not true`);
            } catch { failures.push(`${path}: report missing (the preceding gate did not run or did not write evidence)`); }
          }
          const run=`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          await writeFile('build/orch-080/T28/failure.md', `Official desktop ${process.env.VERSION} did not qualify. The update channel was not published.\n\nFailed assertions:\n${failures.map(x=>`- ${x}`).join('\n')}\n\nWorkflow run: ${run}\n`);
          NODE
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file build/orch-080/T28/failure.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file build/orch-080/T28/failure.md
          fi
