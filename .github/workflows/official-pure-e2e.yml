name: Official pure portable end-to-end acceptance
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Acceptance scenario; both routes retain evidence without publishing'
        type: choice
        required: true
        default: update
        options: [update, data-transfer]
      candidate_version:
        description: 'Optional assertion for the version currently served by the official desktop feed'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  pure-portable-e2e:
    if: inputs.scenario == 'update'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - name: Resolve the real old and new official candidates
        shell: powershell
        env:
          REQUESTED_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $node = (Get-Command node.exe -ErrorAction Stop | Select-Object -First 1).Source
          $helper = 'experiments/official-payload/e2e/report.mjs'
          $oldSource = Join-Path $env:RUNNER_TEMP 'pure-e2e-old-source.json'
          $oldCandidate = Join-Path $env:RUNNER_TEMP 'pure-e2e-old-candidate.json'
          $newCandidate = Join-Path $env:RUNNER_TEMP 'pure-e2e-new-candidate.json'
          Copy-Item -LiteralPath 'experiments/official-payload/candidate.json' -Destination $oldSource
          & $node $helper candidate $oldSource $oldCandidate
          if ($LASTEXITCODE -ne 0) { throw 'Could not normalize the checked-in 0.1.7-rc.2 candidate' }
          & $node 'experiments/official-payload/resolve-candidate.mjs'
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the current official desktop feed candidate' }
          $resolved = Get-Content -LiteralPath 'experiments/official-payload/candidate.json' -Raw | ConvertFrom-Json
          if ($env:REQUESTED_CANDIDATE_VERSION -and $resolved.version -cne $env:REQUESTED_CANDIDATE_VERSION) {
            throw ('Requested candidate_version ' + $env:REQUESTED_CANDIDATE_VERSION + ' does not match the current official feed version ' + $resolved.version)
          }
          & $node $helper candidate 'experiments/official-payload/candidate.json' $newCandidate
          if ($LASTEXITCODE -ne 0) { throw 'Could not normalize the current official candidate' }
          $old = Get-Content -LiteralPath $oldCandidate -Raw | ConvertFrom-Json
          $new = Get-Content -LiteralPath $newCandidate -Raw | ConvertFrom-Json
          if ($old.version -cne '0.1.7-rc.2' -or $new.version -ceq $old.version) { throw 'Old/new official candidate identities are not a real upgrade pair' }
          @(('CANDIDATE_OLD=' + $oldCandidate), ('CANDIDATE_NEW=' + $newCandidate), ('CANDIDATE_VERSION=' + $new.version)) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
      - id: stage-old
        name: Download and validate the old official installer
        uses: ./.github/actions/official-payload-stage
        with:
          candidate: ${{ runner.temp }}/pure-e2e-old-candidate.json
          installer: ${{ runner.temp }}/official-pure-e2e-old.exe
      - id: stage-new
        name: Download and validate the new official installer
        uses: ./.github/actions/official-payload-stage
        with:
          candidate: ${{ runner.temp }}/pure-e2e-new-candidate.json
          installer: ${{ runner.temp }}/official-pure-e2e-new.exe
      - name: Run full official old-to-new portable acceptance
        shell: powershell
        env:
          INSTALLER_OLD: ${{ steps.stage-old.outputs.installer }}
          INSTALLER_NEW: ${{ steps.stage-new.outputs.installer }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw ('Runner 7-Zip not found: ' + $sevenZip) }
          ./experiments/official-payload/e2e/run-pure-e2e.ps1 `
            -InstallerOld $env:INSTALLER_OLD `
            -CandidateOld $env:CANDIDATE_OLD `
            -InstallerNew $env:INSTALLER_NEW `
            -CandidateNew $env:CANDIDATE_NEW `
            -SevenZip $sevenZip `
            -WorkRoot 'build/orch-080/T27/work' `
            -Locale en
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: official-pure-e2e-evidence
          path: |
            build/orch-080/T27/pure-e2e-report.json
            build/orch-080/T27/stage.log
            build/orch-080/T27/launcher.log
            build/orch-080/T27/update-status.json
            build/orch-080/T27/current.json
            build/orch-080/T27/follow.json
            build/orch-080/T27/receipts/*.json
            build/orch-080/T27/request-log.jsonl
            build/orch-080/T27/index-request-log.jsonl
            build/orch-080/T27/ui-result.json
            build/orch-080/T27/ui-probe-output.log
            build/orch-080/T27/ui-probe-stderr.log
            build/orch-080/T27/feed-start.json
            build/orch-080/T27/feed-stderr.log
            build/orch-080/T27/index-server-start.json
            build/orch-080/T27/index-server-stderr.log
            build/orch-080/T27/outside-writes.json
            build/orch-080/T27/write-trace-summary.json
            build/orch-080/T27/write-trace-context.json
            build/orch-080/T27/protocol-before.json
            build/orch-080/T27/protocol-after.json
          if-no-files-found: warn
          retention-days: 14

  native-data-origin:
    if: inputs.scenario == 'data-transfer'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - name: Export synthetic Native history and settings on an independent Linux host
        run: node experiments/official-payload/e2e/native-data.mjs export "$RUNNER_TEMP/native-data-source" "$RUNNER_TEMP/native-transfer-origin"
      - uses: actions/upload-artifact@v7
        with:
          name: native-transfer-origin
          path: ${{ runner.temp }}/native-transfer-origin/
          if-no-files-found: error
          retention-days: 14

  native-data-desktop:
    name: Native data transfer (${{ matrix.os }}, ${{ matrix.mode }})
    needs: native-data-origin
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            mode: plain
            archive: legacy.dshdata
            origin: origin.json
            password_file: ''
          - os: windows-2025
            mode: encrypted
            archive: encrypted.dshdata
            origin: origin-encrypted.json
            password_file: synthetic-password.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v8
        with:
          name: native-transfer-origin
          path: artifacts/native-transfer-origin
      - name: Resolve the current signed desktop candidate
        shell: powershell
        env:
          REQUESTED_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Join-Path $env:RUNNER_TEMP 'native-data-baseline-candidate.json'
          Copy-Item -LiteralPath 'experiments/official-payload/candidate.json' -Destination $baseline
          node experiments/official-payload/resolve-candidate.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the official desktop feed' }
          $candidate = Get-Content -LiteralPath 'experiments/official-payload/candidate.json' -Raw | ConvertFrom-Json
          if ($env:REQUESTED_CANDIDATE_VERSION -and $candidate.version -cne $env:REQUESTED_CANDIDATE_VERSION) { throw 'Requested version does not match the actual official feed' }
          ('NATIVE_INDEX_BASELINE=' + $baseline) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
      - id: stage-native
        name: Download and verify the actual official installer
        uses: ./.github/actions/official-payload-stage
        with:
          candidate: experiments/official-payload/candidate.json
          installer: ${{ runner.temp }}/native-data-official.exe
      - name: Import another host's archive and verify real desktop UI twice
        shell: powershell
        env:
          NATIVE_INSTALLER: ${{ steps.stage-native.outputs.installer }}
          NATIVE_ARCHIVE: ${{ matrix.archive }}
          NATIVE_ORIGIN: ${{ matrix.origin }}
          NATIVE_PASSWORD_FILE: ${{ matrix.password_file }}
        run: |
          $ErrorActionPreference = 'Stop'
          $passwordFile = if ($env:NATIVE_PASSWORD_FILE) { Join-Path 'artifacts/native-transfer-origin' $env:NATIVE_PASSWORD_FILE } else { '' }
          ./experiments/official-payload/e2e/run-native-data-e2e.ps1 `
            -Installer $env:NATIVE_INSTALLER `
            -Candidate 'experiments/official-payload/candidate.json' `
            -IndexBaselineCandidate $env:NATIVE_INDEX_BASELINE `
            -SevenZip (Join-Path $env:ProgramFiles '7-Zip/7z.exe') `
            -NativeArchive (Join-Path 'artifacts/native-transfer-origin' $env:NATIVE_ARCHIVE) `
            -Origin (Join-Path 'artifacts/native-transfer-origin' $env:NATIVE_ORIGIN) `
            -WorkRoot (Join-Path $env:RUNNER_TEMP 'pure-native-data') `
            -PasswordFile $passwordFile
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-data-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/pure-native-data/evidence/
          if-no-files-found: warn
          retention-days: 14
