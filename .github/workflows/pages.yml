name: Website

on:
  pull_request:
    paths:
      - "site/**"
      - "assets/**"
      - "scripts/build-site.mjs"
      - "scripts/check-site-browser.mjs"
      - "tests/site-contract.test.mjs"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - "scripts/build-site.mjs"
      - "scripts/check-site-browser.mjs"
      - "tests/site-contract.test.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/site-contract.test.mjs
      - run: node scripts/build-site.mjs
      - name: Install browser acceptance tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify website interactions and layouts
        run: node scripts/check-site-browser.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: website-acceptance
          path: build/site-acceptance
          retention-days: 7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
