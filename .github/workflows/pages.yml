name: Website

on:
  pull_request:
    paths:
      - "site/**"
      - "assets/**"
      - "scripts/build-site*.mjs"
      - "docs/promotion/guides.json"
      - "scripts/check-site-browser.mjs"
      - "tests/site-contract.test.mjs"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - "scripts/build-site*.mjs"
      - "docs/promotion/guides.json"
      - "scripts/check-site-browser.mjs"
      - "tests/site-contract.test.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/site-contract.test.mjs
      - run: node scripts/build-site.mjs
      - name: Install browser acceptance tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify website interactions and layouts
        run: node scripts/check-site-browser.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: website-acceptance
          path: build/site-acceptance
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Tell Bing and other IndexNow engines the site changed
        # Public, key-verified notification for our own pages; a failure never blocks the deploy.
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 30 -X POST https://api.indexnow.org/indexnow             -H 'Content-Type: application/json; charset=utf-8'             -d '{"host":"wsl043.github.io","key":"6d203f8b1cef0e9f2d632ad627993e9d","keyLocation":"https://wsl043.github.io/DSH-Portable/6d203f8b1cef0e9f2d632ad627993e9d.txt","urlList":["https://wsl043.github.io/DSH-Portable/","https://wsl043.github.io/DSH-Portable/en/","https://wsl043.github.io/DSH-Portable/guides/get-started.html","https://wsl043.github.io/DSH-Portable/guides/move-workspace.html"]}'
