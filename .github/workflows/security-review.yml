name: Security boundary review

on:
  pull_request:
    paths:
      - 'launcher/**'
      - 'desktop-bridge/**'
      - 'app/vendor/**'
      - 'tests/**'
      - '.github/security-review/**'
      - '.github/workflows/security-review.yml'

permissions:
  contents: read

concurrency:
  group: security-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository == 'WSL043/DSH-Portable' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/data-transfer-safety-20260919'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      patch_sha: ${{ steps.patch.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Apply the exact reviewed backup and shared-write source diff
        run: python3 .github/security-review/finish-writes.py
      - name: Rebuild the shipped market from its pinned toolchain
        run: |
          npm ci --prefix app --ignore-scripts
          npm install --global pnpm@11.11.0
          pnpm --dir app/vendor/dsh-portable-plugin-market install --frozen-lockfile --ignore-scripts
          pnpm --dir app/vendor/dsh-portable-plugin-market run build:server
      - name: Exercise actual package consumers and all repaired write boundaries
        run: node --test tests/plugin-market-package-path.test.mjs tests/plugin-market-install-webdav-hardening.test.mjs tests/backup-write-security.test.mjs tests/security-boundary-review.test.mjs tests/data-transfer.test.mjs tests/data-transfer-security.test.mjs
      - name: Assemble only the tested source and bundle changes
        id: patch
        run: |
          mkdir -p "$RUNNER_TEMP/security-evidence"
          git add -- launcher/portable-core.mjs app/vendor/dsh-portable-plugin-market/src/backup.ts app/vendor/dsh-portable-plugin-market/lib
          git diff --cached --binary > "$RUNNER_TEMP/security-evidence/reviewed.patch"
          git diff --cached --stat > "$RUNNER_TEMP/security-evidence/changes.txt"
          echo "sha=$(sha256sum "$RUNNER_TEMP/security-evidence/reviewed.patch" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reviewed-security-patch
          path: ${{ runner.temp }}/security-evidence/
          if-no-files-found: warn
          retention-days: 7

  commit:
    needs: prepare
    if: github.repository == 'WSL043/DSH-Portable' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/data-transfer-safety-20260919'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: reviewed-security-patch
          path: ${{ runner.temp }}/reviewed-patch
      - name: Commit the tested generated sources to the same review branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PATCH_SHA: ${{ needs.prepare.outputs.patch_sha }}
        run: |
          echo "$PATCH_SHA  $RUNNER_TEMP/reviewed-patch/reviewed.patch" | sha256sum --check
          test "$(git ls-remote origin refs/heads/fix/data-transfer-safety-20260919 | cut -f 1)" = "$EXPECTED_HEAD"
          if [ ! -s "$RUNNER_TEMP/reviewed-patch/reviewed.patch" ]; then exit 0; fi
          git apply --index "$RUNNER_TEMP/reviewed-patch/reviewed.patch"
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          exact = {'launcher/portable-core.mjs','app/vendor/dsh-portable-plugin-market/src/backup.ts'}
          assert all(not p or p in exact or p.startswith('app/vendor/dsh-portable-plugin-market/lib/') for p in paths), paths
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): secure profile backups and shared atomic writes'
          git push origin HEAD:refs/heads/fix/data-transfer-safety-20260919
