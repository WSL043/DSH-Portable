version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # Rust is a coordinated compiler baseline, validated with Cargo and native artifacts.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        update-types: [minor, patch]
